<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Yearbook — Archive</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        /* ============================================================
           CSS VARIABLES — Blue Theme
           ============================================================ */
        :root {
            --bg-primary: #05050e;
            --bg-card: rgba(255, 255, 255, 0.02);
            --border-glass: rgba(255, 255, 255, 0.06);
            
            /* Blue Accent */
            --accent-primary: #3b82f6;
            --accent-primary-dim: rgba(59, 130, 246, 0.12);
            --accent-primary-glow: rgba(59, 130, 246, 0.20);
            --accent-blue-light: #60a5fa;
            --accent-blue-dark: #1d4ed8;
            
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #475569;
            
            --font-mono: 'JetBrains Mono', 'Courier New', monospace;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --transition-smooth: cubic-bezier(0.23, 1, 0.32, 1);
            --transition-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* ============================================================
           RESET & BASE
           ============================================================ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100vh;
            background: #000000;
            color: var(--text-primary);
            font-family: var(--font-sans);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ============================================================
           STARTUP OVERLAY
           ============================================================ */
        #startup-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.9s var(--transition-smooth);
            will-change: opacity;
            padding: 2rem;
        }

        #startup-overlay.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        #startup-overlay .boot-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            max-width: 640px;
            width: 100%;
            text-align: center;
        }

        #boot-message {
            font-family: var(--font-mono);
            font-weight: 400;
            font-size: clamp(0.85rem, 2.2vw, 1.5rem);
            color: var(--text-primary);
            letter-spacing: 0.06em;
            opacity: 0;
            transform: translateY(14px);
            transition: opacity 0.6s var(--transition-smooth),
                transform 0.6s var(--transition-smooth);
            min-height: 3.4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
            width: 100%;
        }

        #boot-message.visible {
            opacity: 1;
            transform: translateY(0);
        }

        #boot-message .highlight-primary {
            color: var(--accent-primary);
            font-weight: 600;
        }

        #boot-message .highlight-green {
            color: var(--accent-green);
            font-weight: 600;
        }

        #boot-message .highlight-amber {
            color: var(--accent-amber);
            font-weight: 600;
        }

        /* loading ring */
        .loading-ring {
            display: inline-block;
            width: 26px;
            height: 26px;
            border: 2px solid rgba(255, 255, 255, 0.04);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: ring-spin 0.8s linear infinite;
            margin-top: 0.5rem;
        }

        @keyframes ring-spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* progress bar */
        .progress-wrapper {
            width: 100%;
            max-width: 340px;
            margin-top: 0.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.3rem;
        }

        .progress-track {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-blue-light));
            border-radius: 2px;
            transition: width 0.3s var(--transition-smooth);
        }

        .progress-label {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            color: var(--text-muted);
            letter-spacing: 0.08em;
            font-weight: 400;
        }

        .progress-label .pct {
            color: var(--text-secondary);
        }

        /* ============================================================
           COVER / LOGO SCREEN
           ============================================================ */
        #cover-screen {
            position: fixed;
            inset: 0;
            z-index: 9998;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.2s var(--transition-smooth),
                transform 1.2s var(--transition-smooth);
            transform: scale(0.96);
            padding: 2rem;
        }

        #cover-screen.visible {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }

        #cover-screen.fade-out {
            opacity: 0;
            transform: scale(1.04);
            pointer-events: none;
        }

        #cover-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        /* ---- Logo / Cover placeholder ---- */
        #cover-image {
            width: 180px;
            height: 180px;
            border-radius: 20px;
            border: 2px solid var(--accent-primary);
            background: var(--bg-card);
            box-shadow: 0 0 80px var(--accent-primary-glow),
                inset 0 0 80px var(--accent-primary-dim);
            position: relative;
            margin-bottom: 2rem;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: box-shadow 0.6s ease;
        }

        #cover-image::after {
            content: '';
            position: absolute;
            inset: -6px;
            border-radius: 24px;
            border: 1px solid rgba(59, 130, 246, 0.10);
            animation: cover-ring 3.5s ease-in-out infinite;
        }

        @keyframes cover-ring {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.3;
            }
            50% {
                transform: scale(1.06);
                opacity: 0.7;
            }
        }

        #cover-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        #cover-image .placeholder-text {
            font-family: var(--font-mono);
            font-size: 0.6rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            text-align: center;
            line-height: 1.5;
            padding: 1rem;
            user-select: none;
        }

        /* ---- Typography ---- */
        #cover-container .yearbook-title {
            font-family: var(--font-sans);
            font-weight: 800;
            font-size: clamp(2.4rem, 5vw, 4rem);
            letter-spacing: 0.04em;
            background: linear-gradient(135deg, var(--accent-blue-light), var(--accent-primary), var(--accent-blue-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.2rem;
        }

        #cover-container .school-name {
            font-family: var(--font-mono);
            font-weight: 400;
            font-size: clamp(0.8rem, 1.2vw, 1.1rem);
            color: var(--text-secondary);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 0.1rem;
        }

        #cover-container .school-year {
            font-family: var(--font-sans);
            font-weight: 300;
            font-size: clamp(1rem, 1.4vw, 1.3rem);
            color: var(--text-muted);
            letter-spacing: 0.2em;
        }

        /* ---- Enter button ---- */
        .enter-btn {
            margin-top: 2.4rem;
            display: inline-block;
            font-family: var(--font-sans);
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            padding: 0.9rem 3.2rem;
            border: none;
            border-radius: 9999px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-blue-dark));
            color: #fff;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.3s var(--transition-bounce),
                box-shadow 0.3s ease,
                background 0.3s ease;
            box-shadow: 0 4px 32px rgba(59, 130, 246, 0.25);
            position: relative;
            overflow: hidden;
            user-select: none;
        }

        .enter-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 6px 48px rgba(59, 130, 246, 0.35);
            background: linear-gradient(135deg, #60a5fa, #2563eb);
        }

        .enter-btn:active {
            transform: scale(0.95);
        }

        .enter-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), transparent);
            pointer-events: none;
        }

        /* subtle glow pulse on the button */
        .enter-btn.glow-pulse {
            animation: btn-glow 2.5s ease-in-out infinite;
        }

        @keyframes btn-glow {
            0%,
            100% {
                box-shadow: 0 4px 32px rgba(59, 130, 246, 0.25);
            }
            50% {
                box-shadow: 0 4px 56px rgba(59, 130, 246, 0.45);
            }
        }

        /* ============================================================
           AMBIENT BACKGROUND (subtle particles / grid)
           ============================================================ */
        .bg-ambient {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .bg-ambient .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.03;
            animation: orb-drift 25s ease-in-out infinite alternate;
        }

        .bg-ambient .orb:nth-child(1) {
            width: 500px;
            height: 500px;
            background: var(--accent-primary);
            top: -15%;
            left: -15%;
            animation-duration: 30s;
        }

        .bg-ambient .orb:nth-child(2) {
            width: 400px;
            height: 400px;
            background: var(--accent-blue-light);
            bottom: -15%;
            right: -15%;
            animation-duration: 35s;
            animation-delay: -8s;
        }

        .bg-ambient .orb:nth-child(3) {
            width: 300px;
            height: 300px;
            background: var(--accent-blue-dark);
            top: 40%;
            left: 50%;
            animation-duration: 28s;
            animation-delay: -12s;
        }

        @keyframes orb-drift {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(80px, -60px) scale(1.2);
            }
        }

        /* subtle grid overlay */
        .bg-grid {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.006) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.006) 1px, transparent 1px);
            background-size: 60px 60px;
            opacity: 0.4;
        }

        /* scanning line (very subtle) */
        .scan-line {
            position: fixed;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.04), transparent);
            z-index: 0;
            pointer-events: none;
            animation: scan-move 10s ease-in-out infinite;
        }

        @keyframes scan-move {
            0% {
                top: 0%;
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                top: 100%;
                opacity: 0;
            }
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 640px) {
            #cover-image {
                width: 140px;
                height: 140px;
                border-radius: 16px;
            }

            #cover-container .yearbook-title {
                font-size: 2rem;
            }

            #cover-container .school-name {
                font-size: 0.7rem;
            }

            #cover-container .school-year {
                font-size: 0.9rem;
            }

            .enter-btn {
                font-size: 0.75rem;
                padding: 0.75rem 2.4rem;
                margin-top: 1.8rem;
            }

            #boot-message {
                font-size: clamp(0.75rem, 4vw, 1.1rem);
                min-height: 2.8rem;
            }

            .loading-ring {
                width: 22px;
                height: 22px;
            }

            .progress-wrapper {
                max-width: 240px;
            }

            .bg-ambient .orb {
                filter: blur(60px);
            }
        }

        @media (max-width: 420px) {
            #cover-image {
                width: 120px;
                height: 120px;
                border-radius: 14px;
            }

            #cover-container .yearbook-title {
                font-size: 1.6rem;
            }

            #cover-container .school-name {
                font-size: 0.6rem;
                letter-spacing: 0.1em;
            }

            #cover-container .school-year {
                font-size: 0.75rem;
            }

            .enter-btn {
                font-size: 0.65rem;
                padding: 0.6rem 1.8rem;
                margin-top: 1.4rem;
            }
        }

        /* ============================================================
           REDUCED MOTION
           ============================================================ */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }

            #boot-message {
                transition: opacity 0.3s ease, transform 0.3s ease;
            }

            .enter-btn.glow-pulse {
                animation: none;
            }
        }

        /* ============================================================
           UTILITY
           ============================================================ */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- ===== AMBIENT BACKGROUND ===== -->
    <div class="bg-ambient">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>
    <div class="bg-grid"></div>
    <div class="scan-line"></div>

    <!-- ================================================================
    STARTUP OVERLAY
    ================================================================ -->
    <div id="startup-overlay">
        <div class="boot-container">
            <div id="boot-message">
                <span id="boot-text">YEARBOOK SYSTEM</span>
                <div id="boot-extra"></div>
            </div>
        </div>
    </div>

    <!-- ================================================================
    COVER / LOGO SCREEN
    ================================================================ -->
    <div id="cover-screen">
        <div id="cover-container">

            <!-- ===== LOGO / COVER IMAGE PLACEHOLDER ===== -->
            <div id="cover-image">
                <!--
                ============================================================
                REPLACE THIS <img> WITH YOUR OWN PNG/SVG
                ============================================================
                Simply replace the src attribute with your image path.
                Example: <img src="yearbook-cover.png" alt="Yearbook Cover" />
                ============================================================
                -->
                <img src="images/logo.png"
                alt="Yearbook cover placeholder — replace with your image" />
            </div>

            <!-- ===== TYPOGRAPHY ===== -->
            <div class="yearbook-title">LEGACY 2025</div>
            <div class="school-name">MABAYUHAN SENIOR HIGH SCHOOL [MSHS]</div>
            <div class="school-year">CLASS OF 2025 - 2027</div>

            <!-- ===== ENTER BUTTON (LINK UPDATED TO main.html) ===== -->
            <a href="main.html" class="enter-btn glow-pulse">ENTER YEARBOOK</a>

        </div>
    </div>

    <!-- ================================================================
    JAVASCRIPT
    ================================================================ -->
    <script>
        (function() {
            'use strict';

            // ============================================================
            // DOM REFS
            // ============================================================
            const startupOverlay = document.getElementById('startup-overlay');
            const bootMessage = document.getElementById('boot-message');
            const bootText = document.getElementById('boot-text');
            const bootExtra = document.getElementById('boot-extra');

            const coverScreen = document.getElementById('cover-screen');

            // ============================================================
            // BOOT SEQUENCE DATA
            // ============================================================
            const bootSteps = [
                { text: 'YEARBOOK SYSTEM', delay: 500 },
                { text: 'INITIALIZING ARCHIVE…', delay: 700 },
                { text: 'CHECKING DATABASE…', delay: 600 },
                { text: 'ESTABLISHING CONNECTION…', delay: 800, showProgress: true },
                { text: 'LOADING CLASS RECORDS…', delay: 600 },
                { text: 'VERIFYING ARCHIVE INTEGRITY…', delay: 600 },
                { text: 'CONNECTION ESTABLISHED', delay: 500, highlight: 'highlight-green' },
                { text: 'YEARBOOK ARCHIVE ONLINE', delay: 700, highlight: 'highlight-primary' },
            ];

            // ============================================================
            // STATE
            // ============================================================
            let stepIndex = 0;
            let bootTimer = null;
            let progressInterval = null;
            let isBootComplete = false;

            // ============================================================
            // AUDIO (Web Audio – subtle beeps, optional)
            // ============================================================
            let audioCtx = null;

            function initAudio() {
                if (!audioCtx) {
                    try {
                        audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                    } catch (_) { /* no audio */ }
                }
            }

            function playBeep(freq = 520, duration = 40, vol = 0.04) {
                if (!audioCtx) return;
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.value = vol;
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration / 1000);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + duration / 1000);
                } catch (_) { /* ignore */ }
            }

            function playChime() {
                if (!audioCtx) return;
                try {
                    [523, 659, 784].forEach((f, i) => {
                        setTimeout(() => {
                            const osc = audioCtx.createOscillator();
                            const gain = audioCtx.createGain();
                            osc.type = 'sine';
                            osc.frequency.value = f;
                            gain.gain.value = 0.04;
                            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                            osc.connect(gain);
                            gain.connect(audioCtx.destination);
                            osc.start();
                            osc.stop(audioCtx.currentTime + 0.3);
                        }, i * 120);
                    });
                } catch (_) { /* ignore */ }
            }

            // ============================================================
            // HELPERS
            // ============================================================
            function setBootMessage(html, highlightClass = '') {
                bootText.innerHTML = html;
                if (highlightClass) {
                    bootText.className = highlightClass;
                } else {
                    bootText.className = '';
                }
                bootMessage.classList.add('visible');
            }

            function clearBootExtra() {
                bootExtra.innerHTML = '';
            }

            function showLoadingRing(show) {
                if (show) {
                    bootExtra.innerHTML = '<div class="loading-ring"></div>';
                } else {
                    bootExtra.innerHTML = '';
                }
            }

            function showProgress(show) {
                if (show) {
                    bootExtra.innerHTML = `
                        <div class="progress-wrapper">
                            <div class="progress-track">
                                <div class="progress-fill" id="progress-fill"></div>
                            </div>
                            <div class="progress-label">CONNECTING <span class="pct" id="progress-pct">0%</span></div>
                        </div>
                    `;
                } else {
                    bootExtra.innerHTML = '';
                }
            }

            function updateProgress(pct) {
                const fill = document.getElementById('progress-fill');
                const label = document.getElementById('progress-pct');
                if (fill) fill.style.width = pct + '%';
                if (label) label.textContent = pct + '%';
            }

            // ============================================================
            // BOOT SEQUENCE RUNNER
            // ============================================================
            function runBootStep(index) {
                if (index >= bootSteps.length) {
                    // Boot complete
                    isBootComplete = true;
                    clearBootExtra();
                    playChime();
                    setTimeout(() => showCover(), 400);
                    return;
                }

                const step = bootSteps[index];
                let html = step.text;
                if (step.highlight) {
                    html = `<span class="${step.highlight}">${step.text}</span>`;
                }

                setBootMessage(html);
                clearBootExtra();

                // Progress step
                if (step.showProgress) {
                    showProgress(true);
                    let pct = 0;
                    const duration = 1800;
                    const startTime = Date.now();

                    if (progressInterval) clearInterval(progressInterval);
                    progressInterval = setInterval(() => {
                        const elapsed = Date.now() - startTime;
                        const raw = Math.min(elapsed / duration, 1);
                        // ease-in-out
                        const eased = raw < 0.5 ?
                            2 * raw * raw :
                            1 - Math.pow(-2 * raw + 2, 2) / 2;
                        pct = Math.round(eased * 100);
                        updateProgress(pct);

                        if (pct >= 100) {
                            clearInterval(progressInterval);
                            progressInterval = null;
                            playBeep(880, 50, 0.06);
                            setTimeout(() => runBootStep(index + 1), 350);
                        }
                    }, 30);
                    playBeep(440, 30, 0.04);
                    return;
                }

                // Regular step
                if (index > 0 && index < 6) {
                    showLoadingRing(true);
                } else {
                    showLoadingRing(false);
                }

                // Play beeps
                if (index === 6) playBeep(740, 50, 0.06);
                else if (index === 7) playBeep(880, 60, 0.08);
                else if (index > 0) playBeep(480 + index * 20, 35, 0.04);

                const delay = step.delay || 600;
                bootTimer = setTimeout(() => runBootStep(index + 1), delay);
            }

            // ============================================================
            // COVER / LOGO REVEAL
            // ============================================================
            function showCover() {
                startupOverlay.classList.add('fade-out');
                playBeep(440, 70, 0.06);

                setTimeout(() => {
                    startupOverlay.style.display = 'none';
                    coverScreen.classList.add('visible');
                    playChime();
                }, 700);
            }

            // ============================================================
            // START SEQUENCE
            // ============================================================
            function startSequence() {
                initAudio();
                // Click anywhere during startup to init audio
                document.addEventListener('click', initAudio, { once: true });
                startupOverlay.addEventListener('click', initAudio);

                // Small delay before first message
                setTimeout(() => runBootStep(0), 400);
            }

            // ============================================================
            // KEYBOARD: Enter to trigger ENTER YEARBOOK (when cover is visible)
            // ============================================================
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && coverScreen.classList.contains('visible')) {
                    const btn = document.querySelector('.enter-btn');
                    if (btn) btn.click();
                }
            });

            // ============================================================
            // GO
            // ============================================================
            startupOverlay.style.display = 'flex';
            startupOverlay.classList.remove('fade-out');
            coverScreen.classList.remove('visible');
            coverScreen.classList.remove('fade-out');

            startSequence();

            // ============================================================
            // PREFERS-REDUCED-MOTION: remove glow-pulse if needed
            // ============================================================
            const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
            if (motionQuery.matches) {
                document.querySelector('.enter-btn')?.classList.remove('glow-pulse');
            }

        })();
    </script>

</body>
</html>
