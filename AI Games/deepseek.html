<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Nebula Drift – Infinite Levels</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            position: relative;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #000;
        }
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0e1a;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease;
        }
        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #loading-screen .logo {
            font-size: clamp(2rem, 10vw, 5rem);
            font-weight: bold;
            color: #0ff;
            text-shadow: 0 0 30px #0ff, 0 0 60px #0ff, 0 0 100px #00aaff66;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
            font-family: 'Courier New', monospace;
            image-rendering: pixelated;
            text-align: center;
            padding: 0 1rem;
        }
        #loading-screen .logo span {
            color: #f80;
            text-shadow: 0 0 30px #f80, 0 0 60px #f80;
        }
        #loading-screen .subtitle {
            color: #88aacc;
            font-size: clamp(0.8rem, 3vw, 1.5rem);
            letter-spacing: 0.3em;
            margin-bottom: 1.5rem;
            opacity: 0.8;
            text-align: center;
            padding: 0 1rem;
        }
        #loading-progress-wrap {
            width: min(60vw, 400px);
            height: 14px;
            background: #1a2a3a;
            border: 2px solid #0ff;
            border-radius: 2px;
            box-shadow: 0 0 20px #0ff;
            overflow: hidden;
            position: relative;
        }
        #loading-progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #0ff, #f0f, #0ff);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite linear;
            transition: width 0.2s ease;
            box-shadow: 0 0 20px #0ff;
        }
        @keyframes shimmer {
            0% {
                background-position: 0% 0%;
            }
            100% {
                background-position: 200% 0%;
            }
        }
        #loading-text {
            color: #88aacc;
            font-size: clamp(0.7rem, 2.5vw, 1.2rem);
            margin-top: 1rem;
            letter-spacing: 0.2em;
            text-align: center;
        }
        #loading-stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }
        #loading-stars .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            image-rendering: pixelated;
        }
        @keyframes twinkle {
            0% {
                opacity: 0.2;
            }
            100% {
                opacity: 1;
            }
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 12px;
            color: #0ff;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
            z-index: 10;
            font-size: clamp(0.65rem, 2.6vw, 1rem);
            text-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
            max-width: 70vw;
        }
        #ui .row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 12px;
            align-items: center;
        }
        #level-display {
            color: #ffd700;
            text-shadow: 0 0 10px #ffd700, 0 0 20px #ffd70044;
        }
        #health-bar-container {
            width: min(30vw, 160px);
            height: 10px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid #0ff;
            border-radius: 2px;
            overflow: hidden;
            box-shadow: 0 0 8px #0ff;
            flex-shrink: 0;
        }
        #health-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #f0f, #0ff);
            transition: width 0.2s;
            box-shadow: 0 0 12px #0ff;
        }
        #credits-display {
            color: #ffd700;
            text-shadow: 0 0 10px #ffd700, 0 0 20px #ffd70044;
            font-size: clamp(0.6rem, 2.4vw, 0.9rem);
        }
        #perm-upgrades {
            color: #aaffaa;
            font-size: clamp(0.5rem, 2vw, 0.8rem);
            text-shadow: 0 0 8px #0f0444;
            display: flex;
            flex-wrap: wrap;
            gap: 4px 8px;
            margin-top: 2px;
        }
        .perm-badge {
            background: rgba(0, 255, 0, 0.08);
            border: 1px solid #0f0066;
            border-radius: 2px;
            padding: 0 6px;
            font-size: clamp(0.45rem, 1.8vw, 0.7rem);
            color: #8f8;
            white-space: nowrap;
        }
        .perm-badge.legendary {
            border-color: #ffd700;
            color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
        }
        .perm-badge.epic {
            border-color: #bf5fff;
            color: #bf5fff;
            background: rgba(191, 95, 255, 0.1);
        }
        .perm-badge.rare {
            border-color: #4fc3ff;
            color: #4fc3ff;
            background: rgba(79, 195, 255, 0.08);
        }
        .perm-badge.uncommon {
            border-color: #66bb6a;
            color: #66bb6a;
            background: rgba(102, 187, 106, 0.08);
        }
        #boss-hp-container {
            position: absolute;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            width: min(70vw, 500px);
            height: 16px;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #f44;
            border-radius: 2px;
            z-index: 10;
            display: none;
            box-shadow: 0 0 30px #f44222, inset 0 0 20px #f44222;
            overflow: visible;
        }
        #boss-hp-container .label {
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            color: #f44;
            font-size: clamp(0.6rem, 2.5vw, 1rem);
            text-shadow: 0 0 10px #f44;
            white-space: nowrap;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            letter-spacing: 0.1em;
        }
        #boss-hp-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #f00, #f80, #f00);
            background-size: 200% 100%;
            animation: bossPulse 1.2s infinite alternate;
            transition: width 0.15s ease;
            box-shadow: 0 0 20px #f44;
            border-radius: 1px;
        }
        @keyframes bossPulse {
            0% {
                opacity: 0.7;
            }
            100% {
                opacity: 1;
            }
        }
        #drop-notification {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 25;
            color: #ffd700;
            font-size: clamp(1.2rem, 5vw, 2.8rem);
            text-shadow: 0 0 40px #ffd700, 0 0 80px #ffd70044;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            text-align: center;
            font-family: 'Courier New', monospace;
            background: rgba(0, 0, 0, 0.8);
            padding: 16px 24px;
            border: 2px solid #ffd700;
            border-radius: 4px;
            box-shadow: 0 0 60px #ffd70033;
            max-width: 90vw;
        }
        #drop-notification.show {
            opacity: 1;
        }
        #drop-notification .sub {
            font-size: clamp(0.7rem, 2.5vw, 1.2rem);
            color: #fff;
            text-shadow: 0 0 20px #ffff44;
            margin-top: 4px;
        }
        .bottom-btn {
            position: absolute;
            bottom: 18px;
            z-index: 15;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid #666;
            color: #ccc;
            padding: 6px 12px;
            font-size: clamp(0.6rem, 2.4vw, 0.9rem);
            border-radius: 2px;
            cursor: pointer;
            pointer-events: auto;
            font-family: 'Courier New', monospace;
            transition: 0.2s;
            -webkit-tap-highlight-color: transparent;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.03);
            white-space: nowrap;
        }
        .bottom-btn:active {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(0.95);
        }
        #shop-btn {
            right: 16px;
            border-color: #ffd700;
            color: #ffd700;
            text-shadow: 0 0 10px #ffd70044;
            box-shadow: 0 0 20px #ffd70022;
        }
        #leaderboard-btn {
            right: 100px;
            border-color: #0ff;
            color: #0ff;
            text-shadow: 0 0 10px #00ff44;
        }
        #mute-btn {
            left: 12px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            border-color: #666;
            color: #aaa;
        }
        #mute-btn.muted {
            border-color: #f44;
            color: #f44;
        }
        #fs-btn {
            position: absolute;
            top: 10px;
            right: 12px;
            z-index: 12;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid #00ff66;
            color: #0ff;
            width: 32px;
            height: 32px;
            border-radius: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 0 8px #00ff22;
            transition: 0.2s;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Courier New', monospace;
        }
        #fs-btn:active {
            background: rgba(0, 255, 255, 0.2);
        }
        #gameover {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #f44;
            text-align: center;
            display: none;
            pointer-events: auto;
            text-shadow: 0 0 20px #f00, 0 0 40px #800;
            animation: pulse 1.5s infinite;
            z-index: 20;
            width: min(92%, 500px);
            background: rgba(0, 0, 0, 0.92);
            padding: 18px 20px;
            border-radius: 4px;
            border: 2px solid #f44;
            box-shadow: 0 0 60px #f44;
            max-height: 90vh;
            overflow-y: auto;
        }
        #gameover .title {
            font-size: clamp(2rem, 8vw, 3.5rem);
            margin-bottom: 4px;
        }
        #gameover .sub {
            font-size: clamp(0.9rem, 3.2vw, 1.3rem);
            color: #fff;
            margin: 4px 0;
        }
        #gameover .leaderboard-list {
            color: #0ff;
            font-size: clamp(0.7rem, 2.8vw, 1rem);
            margin: 10px 0;
            text-align: left;
            padding: 6px 10px;
            background: rgba(0, 255, 255, 0.04);
            border-radius: 2px;
            max-height: 200px;
            overflow-y: auto;
        }
        #gameover .leaderboard-list .entry {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        #gameover .leaderboard-list .entry .rank {
            color: #ffd700;
            width: 30px;
            flex-shrink: 0;
        }
        #gameover .leaderboard-list .entry .name {
            flex: 1;
            padding-left: 6px;
            color: #fff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        #gameover .leaderboard-list .entry .score {
            color: #0ff;
            flex-shrink: 0;
        }
        #gameover .leaderboard-list .entry.me {
            background: rgba(255, 215, 0, 0.12);
            border-left: 2px solid #ffd700;
            padding-left: 4px;
        }
        #restart-btn {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #f44;
            color: #fff;
            padding: 8px 20px;
            font-size: clamp(1rem, 4vw, 1.5rem);
            border-radius: 2px;
            cursor: pointer;
            text-shadow: 0 0 8px #f00;
            box-shadow: 0 0 15px #f44;
            transition: background 0.2s;
            -webkit-tap-highlight-color: rgba(255, 0, 0, 0.3);
            font-family: 'Courier New', monospace;
            margin-top: 6px;
        }
        #restart-btn:active {
            background: rgba(255, 0, 0, 0.3);
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 0.8;
            }
            50% {
                opacity: 1;
            }
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.88);
            z-index: 50;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            backdrop-filter: blur(4px);
            image-rendering: pixelated;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal-panel {
            background: #0a0e1a;
            border: 2px solid #0ff;
            box-shadow: 0 0 60px #0ff3 inset 0 0 60px #0ff1;
            padding: 18px 20px;
            max-width: 540px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 4px;
            position: relative;
        }
        .modal-panel::-webkit-scrollbar {
            width: 6px;
            background: #111;
        }
        .modal-panel::-webkit-scrollbar-thumb {
            background: #0ff;
            border-radius: 2px;
        }
        .modal-title {
            color: #ffd700;
            font-size: clamp(1.2rem, 5.5vw, 2rem);
            text-align: center;
            text-shadow: 0 0 20px #ffd70044;
            letter-spacing: 0.15em;
            margin-bottom: 4px;
            font-family: 'Courier New', monospace;
        }
        .modal-close {
            position: absolute;
            top: 10px;
            right: 14px;
            background: none;
            border: none;
            color: #f44;
            font-size: 1.6rem;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            transition: 0.2s;
            -webkit-tap-highlight-color: transparent;
            line-height: 1;
        }
        .modal-close:active {
            transform: scale(0.8);
            color: #f88;
        }
        #shop-credits {
            color: #ffd700;
            text-align: center;
            font-size: clamp(0.8rem, 3.2vw, 1.2rem);
            margin-bottom: 12px;
            font-family: 'Courier New', monospace;
        }
        .shop-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid #1a2a3a;
            padding: 8px 12px;
            margin-bottom: 6px;
            border-radius: 2px;
            transition: 0.2s;
            flex-wrap: wrap;
            gap: 4px;
        }
        .shop-item .info {
            flex: 1;
            min-width: 100px;
        }
        .shop-item .info .name {
            color: #fff;
            font-size: clamp(0.7rem, 2.8vw, 1rem);
            font-family: 'Courier New', monospace;
        }
        .shop-item .info .desc {
            color: #88aacc;
            font-size: clamp(0.5rem, 2vw, 0.75rem);
            font-family: 'Courier New', monospace;
        }
        .shop-item .info .level {
            color: #0ff;
            font-size: clamp(0.5rem, 2vw, 0.75rem);
        }
        .shop-item .buy-btn {
            background: rgba(255, 215, 0, 0.12);
            border: 1px solid #ffd700;
            color: #ffd700;
            padding: 4px 14px;
            font-size: clamp(0.6rem, 2.6vw, 0.9rem);
            border-radius: 2px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            transition: 0.2s;
            -webkit-tap-highlight-color: transparent;
            white-space: nowrap;
        }
        .shop-item .buy-btn:active {
            background: rgba(255, 215, 0, 0.3);
            transform: scale(0.95);
        }
        .shop-item .buy-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: #444;
            color: #666;
            transform: none;
        }
        .shop-item .buy-btn.maxed {
            border-color: #0f0;
            color: #0f0;
            background: rgba(0, 255, 0, 0.08);
            cursor: default;
        }
        .shop-item .buy-btn.maxed:active {
            transform: none;
        }
        .skin-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid #1a2a3a;
            padding: 8px 12px;
            margin-bottom: 6px;
            border-radius: 2px;
            transition: 0.2s;
            flex-wrap: wrap;
            gap: 4px;
        }
        .skin-item .preview {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #333;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .skin-item .info {
            flex: 1;
            min-width: 100px;
            padding-left: 8px;
        }
        .skin-item .info .name {
            color: #fff;
            font-size: clamp(0.7rem, 2.8vw, 1rem);
            font-family: 'Courier New', monospace;
        }
        .skin-item .info .status {
            color: #88aacc;
            font-size: clamp(0.5rem, 2vw, 0.75rem);
            font-family: 'Courier New', monospace;
        }
        .skin-item .action-btn {
            background: rgba(255, 215, 0, 0.12);
            border: 1px solid #ffd700;
            color: #ffd700;
            padding: 4px 14px;
            font-size: clamp(0.6rem, 2.6vw, 0.9rem);
            border-radius: 2px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            transition: 0.2s;
            -webkit-tap-highlight-color: transparent;
            white-space: nowrap;
        }
        .skin-item .action-btn:active {
            background: rgba(255, 215, 0, 0.3);
            transform: scale(0.95);
        }
        .skin-item .action-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: #444;
            color: #666;
        }
        .skin-item .action-btn.equipped {
            border-color: #0f0;
            color: #0f0;
            background: rgba(0, 255, 0, 0.08);
        }
        .skin-item .action-btn.owned {
            border-color: #0ff;
            color: #0ff;
            background: rgba(0, 255, 255, 0.08);
        }
        .leaderboard-entry {
            display: flex;
            justify-content: space-between;
            padding: 5px 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-family: 'Courier New', monospace;
            font-size: clamp(0.7rem, 2.8vw, 1rem);
            color: #ccc;
        }
        .leaderboard-entry .rank {
            color: #ffd700;
            width: 36px;
            flex-shrink: 0;
        }
        .leaderboard-entry .name {
            flex: 1;
            padding-left: 6px;
            color: #fff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .leaderboard-entry .score {
            color: #0ff;
            flex-shrink: 0;
        }
        .leaderboard-entry .level {
            color: #ffd700;
            width: 50px;
            text-align: right;
            font-size: 0.9em;
            flex-shrink: 0;
        }
        .leaderboard-entry.me {
            background: rgba(255, 215, 0, 0.10);
            border-left: 2px solid #ffd700;
            padding-left: 4px;
        }
        .leaderboard-empty {
            color: #666;
            text-align: center;
            padding: 16px 0;
            font-family: 'Courier New', monospace;
        }
        #name-input-overlay .modal-panel {
            max-width: 380px;
        }
        #name-input-overlay .input-group {
            display: flex;
            gap: 8px;
            margin: 12px 0;
            flex-wrap: wrap;
            justify-content: center;
        }
        #name-input-overlay input {
            background: #111;
            border: 1px solid #0ff;
            color: #fff;
            padding: 6px 10px;
            font-size: clamp(0.9rem, 3.5vw, 1.2rem);
            font-family: 'Courier New', monospace;
            border-radius: 2px;
            flex: 1;
            min-width: 100px;
            outline: none;
        }
        #name-input-overlay input:focus {
            border-color: #ffd700;
            box-shadow: 0 0 20px #ffd70033;
        }
        #name-input-overlay .submit-btn {
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid #ffd700;
            color: #ffd700;
            padding: 6px 16px;
            font-size: clamp(0.9rem, 3.5vw, 1.2rem);
            border-radius: 2px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            transition: 0.2s;
        }
        #name-input-overlay .submit-btn:active {
            background: rgba(255, 215, 0, 0.3);
            transform: scale(0.95);
        }
        #name-input-overlay .prompt-text {
            color: #fff;
            font-size: clamp(0.8rem, 3.2vw, 1.1rem);
            text-align: center;
            font-family: 'Courier New', monospace;
        }
        @media (max-width: 480px) {
            #ui {
                top: 6px;
                left: 8px;
                font-size: clamp(0.5rem, 2.4vw, 0.7rem);
                gap: 2px;
                max-width: 75vw;
            }
            #ui .row {
                gap: 4px 10px;
            }
            #health-bar-container {
                height: 8px;
                width: min(25vw, 100px);
            }
            #boss-hp-container {
                height: 12px;
                bottom: 52px;
                width: min(80vw, 300px);
            }
            #boss-hp-container .label {
                font-size: clamp(0.4rem, 2vw, 0.7rem);
                top: -16px;
            }
            .bottom-btn {
                padding: 4px 8px;
                font-size: clamp(0.4rem, 2.2vw, 0.6rem);
                bottom: 12px;
            }
            #mute-btn {

<body>

    <!-- LOADING -->
    <div id="loading-screen">
        <div id="loading-stars"></div>

    <!-- UI -->
    <div id="ui">
        <div class="row">

        <div class="row">

    <!-- BUTTONS -->
    <button id="shop-btn" class="bottom-btn" onclick="window.toggleShop()">⬡ SHOP</button>
    <button id="leaderboard-btn" class="bottom-btn" onclick="window.toggleLeaderboard()">🏆 TOP 3</button>
    <button id="mute-btn" class="bottom-btn" onclick="window.toggleMute()">♫</button>
    <button id="fs-btn" onclick="window.toggleFullscreen()">⛶</button>

    <canvas id="gameCanvas"></canvas>

    <!-- SHOP -->
    <div id="shop-overlay" class="modal-overlay">
        <div class="modal-panel">
            <button class="modal-close" onclick="window.toggleShop()">✕</button>
            <div class="modal-title">⬡ UPGRADE SHOP</div>
            <div id="shop-credits">✦ CREDITS: <span id="shop-credits-count">0</span></div>
            <div style="color:#0ff; font-size:clamp(0.7rem, 3vw, 1rem); margin-bottom:6px; border-bottom:1px solid #333; padding-bottom:4px;">STAT UPGRADES</div>
            <div id="shop-items"></div>
            <div style="color:#ffd700; font-size:clamp(0.7rem, 3vw, 1rem); margin:10px 0 6px; border-bottom:1px solid #333; padding-bottom:4px;">SHIP SKINS</div>
            <div id="skin-items"></div>

    <!-- LEADERBOARD -->
    <div id="leaderboard-overlay" class="modal-overlay">
        <div class="modal-panel">
            <button class="modal-close" onclick="window.toggleLeaderboard()">✕</button>
            <div class="modal-title">🏆 TOP 3 SCORES</div>
            <div style="color:#88aacc;text-align:center;font-size:clamp(0.6rem,2.5vw,0.9rem);margin-bottom:6px;font-family:'Courier New',monospace;">
                highest levels reached

        </div>
    </div>

    <!-- NAME INPUT -->
    <div id="name-input-overlay" class="modal-overlay">
        <div class="modal-panel">
            <button class="modal-close" onclick="window._cancelNameInput()">✕</button>
            <div class="modal-title">✎ NEW HIGH SCORE!</div>
            <div class="prompt-text">Enter your name (max 12 chars):</div>
            <div class="input-group">
                <input type="text" id="name-input" maxlength="12" placeholder="PILOT" autofocus>
                <button class="submit-btn" id="name-submit-btn">SUBMIT</button>
            </div>
        </div>
    </div>

    <script>
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // LOADING
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        (function initLoading() {
            const c = document.getElementById('loading-stars');
            for (let i = 0; i < 80; i++) {
                const s = document.createElement('div');
                s.className = 'star';
                const sz = 1 + Math.random() * 2.5;
                s.style.width = sz + 'px';
                s.style.height = sz + 'px';
                s.style.left = Math.random() * 100 + '%';
                s.style.top = Math.random() * 100 + '%';
                s.style.opacity = 0.2 + Math.random() * 0.7;
                s.style.animation = 'twinkle ' + (2 + Math.random() * 4) + 's infinite alternate';
                c.appendChild(s);
            }
            const bar = document.getElementById('loading-progress-bar');
            const txt = document.getElementById('loading-text');
            let prog = 0;
            const iv = setInterval(() => {
                prog += 1 + Math.random() * 3;
                if (prog >= 100) { prog = 100;
                    clearInterval(iv);
                    setTimeout(() => {
                        document.getElementById('loading-screen').classList.add('hidden');
                    }, 400); }
                bar.style.width = Math.min(prog, 100) + '%';
                const d = '.'.repeat(Math.floor(prog / 12) % 4);
                txt.textContent = 'LOADING' + d;
            }, 80);
        })();

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // GAME CORE
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        (function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            let W, H;

            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            // ─── AUDIO (safe init) ───
            let audioCtx = null,
                isMuted = false;
            let bgOsc1, bgOsc2, bgGain1, bgGain2, bgInterval;
            let audioInitialized = false;

            function initAudioSafe() {
                if (audioInitialized) return;
                try {
                    audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                    audioInitialized = true;
                    startBgMusic();
                } catch (e) { console.warn('Audio not supported'); }
            }

            function resumeAudio() {
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                if (!audioInitialized) initAudioSafe();
            }
            document.addEventListener('click', resumeAudio);
            document.addEventListener('keydown', resumeAudio);
            document.addEventListener('touchstart', resumeAudio, { passive: false });

            function startBgMusic() {
                if (!audioCtx || isMuted) return;
                try {
                    if (bgOsc1) { bgOsc1.stop();
                        bgOsc1 = null; }
                    if (bgOsc2) { bgOsc2.stop();
                        bgOsc2 = null; }
                    bgOsc1 = audioCtx.createOscillator();
                    bgGain1 = audioCtx.createGain();
                    bgOsc1.type = 'sawtooth';
                    bgOsc1.frequency.setValueAtTime(55, audioCtx.currentTime);
                    bgOsc1.frequency.exponentialRampToValueAtTime(65, audioCtx.currentTime + 2);
                    bgGain1.gain.setValueAtTime(0.03, audioCtx.currentTime);
                    bgGain1.gain.exponentialRampToValueAtTime(0.02, audioCtx.currentTime + 1);
                    bgOsc1.connect(bgGain1).connect(audioCtx.destination);
                    bgOsc1.start();
                    bgOsc2 = audioCtx.createOscillator();
                    bgGain2 = audioCtx.createGain();
                    bgOsc2.type = 'square';
                    bgOsc2.frequency.setValueAtTime(440, audioCtx.currentTime);
                    bgGain2.gain.setValueAtTime(0.012, audioCtx.currentTime);
                    bgOsc2.connect(bgGain2).connect(audioCtx.destination);
                    bgOsc2.start();
                    const notes = [523, 659, 784, 880, 784, 659, 523, 440];
                    let idx = 0;
                    if (bgInterval) clearInterval(bgInterval);
                    bgInterval = setInterval(() => {
                        if (isMuted || !audioCtx) return;
                        try {
                            const f = notes[idx % notes.length];
                            bgOsc2.frequency.exponentialRampToValueAtTime(f, audioCtx.currentTime + 0.05);
                            bgGain2.gain.setValueAtTime(0.02, audioCtx.currentTime);
                            bgGain2.gain.exponentialRampToValueAtTime(0.006, audioCtx.currentTime + 0.3);
                            idx++;
                        } catch (e) { /* ignore */ }
                    }, 280);
                } catch (e) { /* ignore */ }
            }

            function stopBgMusic() {
                try {
                    if (bgInterval) { clearInterval(bgInterval);
                        bgInterval = null; }
                    if (bgOsc1) { bgOsc1.stop();
                        bgOsc1 = null; }
                    if (bgOsc2) { bgOsc2.stop();
                        bgOsc2 = null; }
                    if (bgGain1) { bgGain1.disconnect();
                        bgGain1 = null; }
                    if (bgGain2) { bgGain2.disconnect();
                        bgGain2 = null; }
                } catch (e) { /* ignore */ }
            }

            function playTone(f, type, dur, vol = 0.05) {
                if (!audioCtx || isMuted) return;
                try {
                    const t = audioCtx.currentTime;
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.type = type;
                    o.frequency.setValueAtTime(f, t);
                    g.gain.setValueAtTime(Math.min(vol, 0.12), t);
                    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
                    o.connect(g).connect(audioCtx.destination);
                    o.start(t);
                    o.stop(t + dur);
                } catch (e) { /* ignore */ }
            }

            function playNoise(dur, vol = 0.05) {
                if (!audioCtx || isMuted) return;
                try {
                    const sr = audioCtx.sampleRate;
                    const len = sr * dur;
                    const buf = audioCtx.createBuffer(1, len, sr);
                    const d = buf.getChannelData(0);
                    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
                    const src = audioCtx.createBufferSource();
                    src.buffer = buf;
                    const g = audioCtx.createGain();
                    g.gain.setValueAtTime(Math.min(vol, 0.10), audioCtx.currentTime);
                    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
                    src.connect(g).connect(audioCtx.destination);
                    src.start();
                } catch (e) { /* ignore */ }
            }

            function playShoot() { playTone(900 + Math.random() * 200, 'square', 0.05, 0.035); }

            function playExplosion() { playNoise(0.15, 0.06); }

            function playPowerup() {
                playTone(600, 'sine', 0.07, 0.04);
                setTimeout(() => { playTone(900, 'sine', 0.07, 0.035); }, 70);
            }

            function playUpgrade() {
                playTone(523, 'sine', 0.07, 0.04);
                setTimeout(() => { playTone(659, 'sine', 0.07, 0.04); }, 90);
                setTimeout(() => { playTone(784, 'sine', 0.10, 0.04); }, 180);
            }

            function playBossAlert() {
                playTone(300, 'sawtooth', 0.2, 0.06);
                setTimeout(() => { playTone(400, 'sawtooth', 0.2, 0.06); }, 150);
                setTimeout(() => { playTone(500, 'sawtooth', 0.3, 0.06); }, 300);
            }

            function playGameOver() {
                playTone(400, 'sawtooth', 0.3, 0.05);
                setTimeout(() => { playTone(300, 'sawtooth', 0.4, 0.04); }, 200);
                setTimeout(() => { playTone(200, 'sawtooth', 0.5, 0.035); }, 450);
            }

            window.toggleMute = function() {
                isMuted = !isMuted;
                const btn = document.getElementById('mute-btn');
                btn.textContent = isMuted ? '♫' : '♫';
                btn.classList.toggle('muted', isMuted);
                if (isMuted) stopBgMusic();
                else { if (audioCtx) { if (audioCtx.state === 'suspended') audioCtx.resume();
                        startBgMusic(); } else initAudioSafe(); }
            };

            // ─── INPUT ───
            const keys = {};
            let targetX = W / 2,
                targetY = H / 2;
            let useMouse = false;

            // Track raw input positions for direct movement
            let rawX = W / 2,
                rawY = H / 2;

            // Keyboard
            window.addEventListener('keydown', e => { keys[e.key] = true;
                e.preventDefault(); });
            window.addEventListener('keyup', e => { keys[e.key] = false;
                e.preventDefault(); });

            // Mouse: follow cursor continuously when over canvas
            canvas.addEventListener('mousemove', e => {
                const r = canvas.getBoundingClientRect();
                rawX = e.clientX - r.left;
                rawY = e.clientY - r.top;
                targetX = rawX;
                targetY = rawY;
                useMouse = true;
            });

            canvas.addEventListener('mouseleave', () => {
                useMouse = false;
            });

            // Touch events
            canvas.addEventListener('touchstart', e => {
                e.preventDefault();
                resumeAudio();
                useMouse = true;
                const r = canvas.getBoundingClientRect();
                const touch = e.touches[0];
                rawX = touch.clientX - r.left;
                rawY = touch.clientY - r.top;
                targetX = rawX;
                targetY = rawY;
            }, { passive: false });

            canvas.addEventListener('touchmove', e => {
                e.preventDefault();
                const r = canvas.getBoundingClientRect();
                const touch = e.touches[0];
                rawX = touch.clientX - r.left;
                rawY = touch.clientY - r.top;
                targetX = rawX;
                targetY = rawY;
                useMouse = true;
            }, { passive: false });

            canvas.addEventListener('touchend', e => {
                e.preventDefault();
                useMouse = false;
            }, { passive: false });

            canvas.addEventListener('touchcancel', e => {
                e.preventDefault();
                useMouse = false;
            }, { passive: false });

            // ─── DOM ───
            const scoreDiv = document.getElementById('score');
            const levelDiv = document.getElementById('level-display');
            const healthBar = document.getElementById('health-bar');
            const gameOverDiv = document.getElementById('gameover');
            const scoreSub = document.getElementById('score-sub');
            const creditsSpan = document.getElementById('credits-count');
            const shopCreditsSpan = document.getElementById('shop-credits-count');
            const bossHpContainer = document.getElementById('boss-hp-container');
            const bossHpBar = document.getElementById('boss-hp-bar');
            const bossLabel = document.getElementById('boss-label');
            const dropNotif = document.getElementById('drop-notification');
            const dropTitle = document.getElementById('drop-title');
            const dropSub = document.getElementById('drop-sub');
            const permUpgradesDiv = document.getElementById('perm-upgrades');

            // ─── STATE ───
            let score = 0,
                level = 1,
                gameOver = false;
            let credits = 0;
            let shakeMag = 0,
                shakeDur = 0;
            let isShopOpen = false,
                isLeaderboardOpen = false,
                isNameInputOpen = false;
            let _leaderboardPrompted = false;

            // ─── SKINS ───
            const SKINS = [
                { id: 'default', name: 'Default', cost: 0, primary: '#0cf', accent: '#f80', engine: '#ff6600', shape: 'classic' },
                { id: 'crimson', name: 'Crimson', cost: 100, primary: '#f44', accent: '#ff0', engine: '#f80', shape: 'classic' },
                { id: 'emerald', name: 'Emerald', cost: 150, primary: '#4f4', accent: '#0ff', engine: '#0f0', shape: 'classic' },
                { id: 'royal', name: 'Royal', cost: 200, primary: '#a4f', accent: '#ffd700', engine: '#bf5fff', shape: 'classic' },
                { id: 'void', name: 'Void', cost: 300, primary: '#333', accent: '#888', engine: '#666', shape: 'sleek' },
                { id: 'phoenix', name: 'Phoenix', cost: 500, primary: '#f80', accent: '#ff0', engine: '#ff4400', shape: 'aggressive' },
            ];

            // ─── PERMANENT UPGRADES (from bosses) ───
            const permUpgrades = {
                hp: { label: 'HP+', value: 0, max: 20, rarity: 'common', icon: '♥' },
                damage: { label: 'DMG+', value: 0, max: 20, rarity: 'common', icon: '⚔' },
                bulletSpeed: { label: 'SPD+', value: 0, max: 20, rarity: 'common', icon: '➤' },
                moveSpeed: { label: 'MOV+', value: 0, max: 15, rarity: 'uncommon', icon: '◈' },
                fireRate: { label: 'FR-', value: 0, max: 10, rarity: 'uncommon', icon: '◉' },
                shield: { label: 'SHIELD', value: 0, max: 1, rarity: 'rare', icon: '🛡' },
                regen: { label: 'REGEN', value: 0, max: 1, rarity: 'epic', icon: '✦' },
                extraLife: { label: 'EXTRA LIFE', value: 0, max: 1, rarity: 'legendary', icon: '🌟' },
                bulletSize: { label: 'BULLET+', value: 0, max: 5, rarity: 'rare', icon: '◍' },
            };

            // ─── SKIN STATE ───
            let ownedSkins = ['default'];
            let currentSkin = 'default';

            function loadSkinData() {
                try {
                    const data = localStorage.getItem('nebulaDriftSkins');
                    if (data) {
                        const parsed = JSON.parse(data);
                        if (parsed.ownedSkins) ownedSkins = parsed.ownedSkins;
                        if (parsed.currentSkin) currentSkin = parsed.currentSkin;
                    }
                } catch (e) { /* ignore */ }
            }

            function saveSkinData() {
                try {
                    localStorage.setItem('nebulaDriftSkins', JSON.stringify({ ownedSkins, currentSkin }));
                } catch (e) { /* ignore */ }
            }

            loadSkinData();

            function getSkin(id) {
                return SKINS.find(s => s.id === id) || SKINS[0];
            }

            function getCurrentSkin() {
                return getSkin(currentSkin);
            }

            function isSkinOwned(id) {
                return ownedSkins.includes(id);
            }

            function buySkin(id) {
                const skin = getSkin(id);
                if (!skin) return false;
                if (isSkinOwned(id)) return false;
                if (credits < skin.cost) return false;
                credits -= skin.cost;
                ownedSkins.push(id);
                saveSkinData();
                playUpgrade();
                updateShopUI();
                updateUI();
                return true;
            }

            function equipSkin(id) {
                if (!isSkinOwned(id)) return false;
                currentSkin = id;
                saveSkinData();
                updateShopUI();
                updateUI();
                return true;
            }

            function getPermBonus(key) {
                const u = permUpgrades[key];
                if (!u) return 0;
                switch (key) {
                    case 'hp':
                        return u.value * 12;
                    case 'damage':
                        return u.value * 3;
                    case 'bulletSpeed':
                        return u.value * 30;
                    case 'moveSpeed':
                        return u.value * 12;
                    case 'fireRate':
                        return u.value * 0.012;
                    case 'shield':
                        return u.value > 0 ? 1 : 0;
                    case 'regen':
                        return u.value > 0 ? 1 : 0;
                    case 'extraLife':
                        return u.value > 0 ? 1 : 0;
                    case 'bulletSize':
                        return u.value * 0.4;
                    default:
                        return 0;
                }
            }

            function addPermanentUpgrade(key, displayName) {
                const u = permUpgrades[key];
                if (!u) return false;
                if (u.value >= u.max) return false;
                u.value++;
                const rarityMap = { common: '#8f8', uncommon: '#4fc3ff', rare: '#bf5fff', epic: '#ffd700',
                    legendary: '#ff6b6b' };
                const rarityNames = { common: 'COMMON', uncommon: 'UNCOMMON', rare: 'RARE', epic: 'EPIC',
                    legendary: 'LEGENDARY' };
                const color = rarityMap[u.rarity] || '#fff';

            // ─── LEADERBOARD ───

                e) { /* ignore */ }

            function addScoreToLeaderboard(name, scoreVal, levelVal) {
                let lb = getLeaderboard();
                lb.push({ name: name.trim().substring(0, 12) || 'PILOT', score: scoreVal, level: levelVal });
                lb.sort((a, b) => b.score - a.score);
                lb = lb.slice(0, 3);
                saveLeaderboard(lb);

            const CELL_SIZE = 120;
            class SpatialGrid {
                constructor() { this.cells = new Map(); }
                clear() { this.cells.clear(); }
                key(x, y) { return `${Math.floor(x/CELL_SIZE)},${Math.floor(y/CELL_SIZE)}`; }
                insert(obj) { const k = this.key(obj.x, obj.y); if (!this.cells.has(k)) this.cells.set(k, []);
                    this.cells.get(k).push(obj); }
                getNearby(x, y) {
                    const cx = Math.floor(x / CELL_SIZE),
                        cy = Math.floor(y / CELL_SIZE);
                    const nearby = [];
                    for (let dx = -1; dx <= 1; dx++)
                        for (let dy = -1; dy <= 1; dy++) {
                            const k = `${cx+dx},${cy+dy}`;
                            if (this.cells.has(k)) nearby.push(...this.cells.get(k));
                        }
                    return nearby;
                }
            }

            function clamp(v, mn, mx) { return Math.max(mn, Math.min(mx, v)); }

            function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

            function spawnParticle(x, y, vx, vy, color, life = 0.5, size = 2) {
                let p;
                if (particles.length < MAX_PARTICLES) {
                    p = { x, y, vx, vy, color, life, maxLife: life, size };
                    particles.push(p);
                } else {
                    p = particles.shift();
                    p.x = x;
                    p.y = y;
                    p.vx = vx;
                    p.vy = vy;
                    p.color = color;
                    p.life = life;
                    p.maxLife = life;
                    p.size = size;
                    particles.push(p);
                }
            }

            function spawnBulletTrail(x, y, color, size = 2) {
                if (bulletTrails.length >= MAX_TRAILS) bulletTrails.shift();
                bulletTrails.push({ x, y, color, life: 0.25, maxLife: 0.25, size });
            }

            function spawnExplosion(x, y, color, count = 20) {
                for (let i = 0; i < count; i++) {
                    const a = Math.random() * Math.PI * 2;
                    const spd = 80 + Math.random() * 250;
                    spawnParticle(x, y, Math.cos(a) * spd, Math.sin(a) * spd, color, 0.3 + Math.random() * 0.5, 1.5 + Math
                        .random() * 2.5);
                }
            }

            function spawnMuzzleFlash() {
                const skin = getCurrentSkin();
                const x = player.x;
                const y = player.y - player.radius - 4;
                for (let i = 0; i < 12; i++) {
                    const a = -Math.PI / 2 + (Math.random() - 0.5) * 1.2;
                    const spd = 60 + Math.random() * 180;
                    const size = 1.5 + Math.random() * 3;
                    const colors = [skin.accent, '#fff', skin.primary, '#ff4400'];
                    spawnParticle(x, y, Math.cos(a) * spd, Math.sin(a) * spd,
                        colors[Math.floor(Math.random() * colors.length)],
                        0.12 + Math.random() * 0.18, size);
                }
                for (let i = 0; i < 8; i++) {
                    const a = -Math.PI / 2 + (Math.random() - 0.5) * 0.8;
                    const spd = 30 + Math.random() * 60;
                    spawnParticle(x, y, Math.cos(a) * spd, Math.sin(a) * spd,
                        '#fff', 0.08, 1 + Math.random() * 2);
                }
                spawnParticle(x, y, 0, -20, skin.accent, 0.15, 6);
                spawnParticle(x, y, 0, -40, skin.engine, 0.10, 4);
            }

            function firePlayerBullet(angle) {
                const sz = 3 + getPermBonus('bulletSize');
                const vx = Math.cos(angle) * player.bulletSpeed;
                const vy = Math.sin(angle) * player.bulletSpeed;
                const b = {
                    x: player.x,
                    y: player.y - 4,
                    vx,
                    vy,
                    radius: sz,
                    damage: player.damage,
                    life: player.bulletLife,
                    trailTimer: 0
                };
                playerBullets.push(b);
                const skin = getCurrentSkin();
                for (let i = 0; i < 3; i++) {
                    spawnBulletTrail(b.x - vx * 0.02 * i, b.y - vy * 0.02 * i, skin.accent, sz * 0.5);
                }
                player.recoil = 4;
            }

                enemiesSpawned = 0;

                levelEnemyCount = Math.min(3 + lvl, 20);
                const numBasic = Math.max(1, Math.floor(levelEnemyCount * 0.6));
                const numFast = Math.max(0, Math.floor(levelEnemyCount * 0.25));
                const numTank = Math.max(0, levelEnemyCount - numBasic - numFast);
                let spawnCount = 0;
                const spawnInterval = setInterval(() => {
                    if (gameOver || enemies.length > 30) { clearInterval(spawnInterval); return; }
                    if (spawnCount >= levelEnemyCount) { clearInterval(spawnInterval); return; }
                    let type = 'basic';
                    if (spawnCount < numBasic) type = 'basic';
                    else if (spawnCount < numBasic + numFast) type = 'fast';
                    else type = 'tank';
                    spawnEnemy(type);
                    spawnCount++;
                    enemiesSpawned++;
                }, 300 + lvl * 10);

                if (lvl % 10 === 0) {
                    setTimeout(() => {
                        if (!gameOver && !bossActive) {
                            spawnBoss('boss');
