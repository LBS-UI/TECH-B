                player.regenTimer = 0;
                player.extraLifeUsed = false;
                player.powerupTimers = { rapidFire: 0, spreadShot: 0, shield: 0 };
                player.shootTimer = 0;
                player.recoil = 0;
                playerBullets.length = 0;
                enemyBullets.length = 0;
                enemies.length = 0;
                powerUps.length = 0;
                particles.length = 0;
                bulletTrails.length = 0;
                score = 0;
                credits = 0;
                level = 1;
                shakeMag = 0;
                shakeDur = 0;
                gameOver = false;
                gameOverDiv.style.display = 'none';
                _leaderboardPrompted = false;
                bossActive = false;
                bossType = null;
                bossRef = null;
                bossHpContainer.style.display = 'none';
                applyAllUpgrades();
                updateUI();
                startLevel(level);
                if (!isMuted && audioCtx) {
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                    stopBgMusic();
                    startBgMusic();
                }
                updatePermUpgradesUI();
            }

            window._restartFunc = restartGame;
            window.gameRestart = restartGame;

            // ─── UI UPDATE ───
            function updateUI() {
                scoreDiv.textContent = `SCORE: ${score}`;
                const hpPct = Math.max(0, (player.health / player.maxHealth) * 100);
                healthBar.style.width = `${hpPct}%`;
                creditsSpan.textContent = credits;
                if (!isShopOpen) shopCreditsSpan.textContent = credits;
                if (bossActive && bossRef) {
                    const pct = Math.max(0, (bossRef.health / bossRef.maxHealth) * 100);
                    bossHpBar.style.width = `${pct}%`;
                }
            }

            // ─── UPDATE ───
            function update(dt) {
                if (gameOver || isShopOpen || isLeaderboardOpen || isNameInputOpen) return;
                dt = Math.min(dt, 0.1);

                // ─── DIRECT POSITION-BASED MOVEMENT (NO LAG) ───
                if (useMouse) {
                    // Instantly snap to target with speed limit for smoothness
                    const dx = targetX - player.x;
                    const dy = targetY - player.y;
                    const dist_ = Math.hypot(dx, dy);

                    if (dist_ > 1) {
                        const speed = player.speed * dt;
                        if (dist_ < speed * 0.1) {
                            // Snap directly if very close
                            player.x = targetX;
                            player.y = targetY;
                        } else {
                            // Move toward target at full speed
                            const ratio = Math.min(1, speed / dist_);
                            player.x += dx * ratio;
                            player.y += dy * ratio;
                        }
                    }
                } else {
                    // Keyboard controls - direct movement
                    let mx = 0,
                        my = 0;
                    const speed = player.speed * dt;
                    if (keys['ArrowLeft'] || keys['a'] || keys['A']) mx = -speed;
                    if (keys['ArrowRight'] || keys['d'] || keys['D']) mx = speed;
                    if (keys['ArrowUp'] || keys['w'] || keys['W']) my = -speed;
                    if (keys['ArrowDown'] || keys['s'] || keys['S']) my = speed;

                    if (mx !== 0 && my !== 0) {
                        const norm = Math.sqrt(mx * mx + my * my);
                        mx = (mx / norm) * speed;
                        my = (my / norm) * speed;
                    }

                    player.x += mx;
                    player.y += my;
                }

                // Clamp to screen
                player.x = clamp(player.x, player.radius, W - player.radius);
                player.y = clamp(player.y, player.radius, H - player.radius);

                if (player.invincibleTimer > 0) player.invincibleTimer -= dt;

                if (player.recoil > 0) player.recoil -= dt * 20;
                if (player.recoil < 0) player.recoil = 0;

                for (const k in player.powerupTimers) {
                    if (player.powerupTimers[k] > 0) {
                        player.powerupTimers[k] -= dt;
                        if (player.powerupTimers[k] <= 0) {
                            if (k === 'rapidFire') player.rapidFire = false;
                            if (k === 'spreadShot') player.spreadShot = false;
                            if (k === 'shield') player.shield = false;
                        }
                    }
                }

                if (player.shieldCooldown > 0) player.shieldCooldown -= dt;
                if (getPermBonus('shield') > 0 && !player.shield && player.shieldCooldown <= 0) {
                    player.shield = true;
                }

                if (getPermBonus('regen') > 0) {
                    player.regenTimer += dt;
                    if (player.regenTimer >= 1.5) {
                        player.regenTimer = 0;
                        if (player.health < player.maxHealth) {
                            player.health = Math.min(player.maxHealth, player.health + 1);
                        }
                    }
                }

                // Auto-fire
                player.shootTimer -= dt;
                const interval = player.rapidFire ? 0.06 : player.shootCooldown;
                if (player.shootTimer <= 0) {
                    player.shootTimer = interval;
                    const spread = player.spreadShot ? player.spreadCount + 1 : 0;
                    const baseAngle = -Math.PI / 2;
                    if (spread > 0) {
                        const total = spread + 1;
                        const step = 0.2 / Math.max(1, total - 1);
                        for (let i = 0; i < total; i++) {
                            const a = baseAngle - 0.1 + i * step;
                            firePlayerBullet(a);
                        }
                    } else {
                        firePlayerBullet(baseAngle);
                    }
                    playShoot();
                    spawnMuzzleFlash();
                }

                // Player bullets with trails
                for (let i = playerBullets.length - 1; i >= 0; i--) {
                    const b = playerBullets[i];
                    b.trailTimer += dt;
                    if (b.trailTimer > 0.02) {
                        b.trailTimer = 0;
                        const skin = getCurrentSkin();
                        spawnBulletTrail(b.x, b.y, skin.accent, b.radius * 0.7);
                        spawnBulletTrail(b.x - b.vx * 0.01, b.y - b.vy * 0.01, skin.primary, b.radius * 0.4);
                    }
                    b.x += b.vx * dt;
                    b.y += b.vy * dt;
                    b.life -= dt;
                    if (b.life <= 0 || b.x < -40 || b.x > W + 40 || b.y < -40 || b.y > H + 40) {
                        if (b.life <= 0 && b.x > 0 && b.x < W && b.y > 0 && b.y < H) {
                            spawnParticle(b.x, b.y, 0, 0, '#ffaa44', 0.08, 2);
                        }
                        playerBullets.splice(i, 1);
                    }
                }

                // Bullet trails cleanup
                for (let i = bulletTrails.length - 1; i >= 0; i--) {
                    const t = bulletTrails[i];
                    t.life -= dt;
                    if (t.life <= 0) bulletTrails.splice(i, 1);
                }

                // Enemy bullets
                for (let i = enemyBullets.length - 1; i >= 0; i--) {
                    const b = enemyBullets[i];
                    b.x += b.vx * dt;
                    b.y += b.vy * dt;
                    b.life -= dt;
                    if (b.life <= 0 || b.x < -40 || b.x > W + 40 || b.y < -40 || b.y > H + 40) {
                        enemyBullets.splice(i, 1);
                    }
                }

                // Enemies
                for (let i = enemies.length - 1; i >= 0; i--) {
                    const e = enemies[i];
                    const dx = player.x - e.x,
                        dy = player.y - e.y;
                    const len = Math.hypot(dx, dy);
                    if (len > 0) {
                        let speedMul = 1;
                        if (e.isBoss || e.isMini) {
                            speedMul = Math.min(1, len / 200);
                        }
                        e.x += (dx / len) * e.speed * speedMul * dt;
                        e.y += (dy / len) * e.speed * speedMul * dt;
                    }
                    e.shootTimer -= dt;
                    if (e.shootTimer <= 0 && len < 650) {
                        e.shootTimer = e.shootCooldown;
                        const angle = Math.atan2(dy, dx);
                        const spd = e.isBoss ? 220 : e.isMini ? 190 : 180;
                        enemyBullets.push({
                            x: e.x,
                            y: e.y,
                            vx: Math.cos(angle) * spd,
                            vy: Math.sin(angle) * spd,
                            radius: e.isBoss ? 6 : 4,
                            damage: e.isBoss ? 20 : e.isMini ? 16 : 12,
                            life: 2.8,
                            color: e.isBoss ? '#f44' : e.isMini ? '#f88' : '#f88'
                        });
                        if (e.isBoss) {
                            for (let a = -0.6; a <= 0.6; a += 0.25) {
                                enemyBullets.push({
                                    x: e.x,
                                    y: e.y,
                                    vx: Math.cos(angle + a) * 190,
                                    vy: Math.sin(angle + a) * 190,
                                    radius: 5,
                                    damage: 15,
                                    life: 2.8,
                                    color: '#faa'
                                });
                            }
                        }
                        if (e.isMini) {
                            for (let a = -0.4; a <= 0.4; a += 0.3) {
                                enemyBullets.push({
                                    x: e.x,
                                    y: e.y,
                                    vx: Math.cos(angle + a) * 170,
                                    vy: Math.sin(angle + a) * 170,
                                    radius: 4,
                                    damage: 12,
                                    life: 2.6,
                                    color: '#faa'
                                });
                            }
                        }
                    }
                    if (e.isBoss || e.isMini) {
                        e.x = clamp(e.x, e.radius + 20, W - e.radius - 20);
                        e.y = clamp(e.y, e.radius + 20, H - e.radius - 20);
                    }
                    if (e.x < -120 || e.x > W + 120 || e.y < -120 || e.y > H + 120) {
                        if (!e.isBoss && !e.isMini) enemies.splice(i, 1);
                    }
                }

                // Powerups
                for (let i = powerUps.length - 1; i >= 0; i--) {
                    const p = powerUps[i];
                    p.y += p.vy * dt;
                    p.life -= dt;
                    if (p.life <= 0 || p.y > H + 30) powerUps.splice(i, 1);
                }

                // Collision: player bullets vs enemies
                const grid = new SpatialGrid();
                for (const e of enemies) grid.insert(e);

                for (let i = playerBullets.length - 1; i >= 0; i--) {
                    const b = playerBullets[i];
                    const nearby = grid.getNearby(b.x, b.y);
                    let hit = false;
                    for (const e of nearby) {
                        if (dist(b, e) < b.radius + e.radius) {
                            e.health -= b.damage;
                            spawnParticle(b.x, b.y, 0, 0, '#fff', 0.12, 3);
                            if (e.health <= 0) {
                                const isBoss = e.isBoss || e.isMini;
                                spawnExplosion(e.x, e.y, e.color, isBoss ? 50 : 20);
                                playExplosion();
                                credits += 5;
                                score += e.score;
                                if (isBoss) {
                                    shakeMag = 18;
                                    shakeDur = 0.4;
                                    spawnExplosion(e.x, e.y, '#fff', 60);
                                    playNoise(0.35, 0.10);
                                    if (e === bossRef) {
                                        bossRef = null;
                                        bossActive = false;
                                        bossHpContainer.style.display = 'none';
                                        handleBossDrop(e.isBoss);
                                    }
                                } else {
                                    if (Math.random() < 0.12) spawnPowerUp(e.x, e.y);
                                }
                                enemies.splice(enemies.indexOf(e), 1);
                                enemiesKilled++;
                                if (!bossActive && enemiesKilled >= levelEnemyCount) {
                                    level++;
                                    startLevel(level);
                                    credits += 5 + level;
                                }
                            } else {
                                playTone(200, 'sawtooth', 0.04, 0.02);
                            }
                            hit = true;
                            break;
                        }
                    }
                    if (hit) playerBullets.splice(i, 1);
                }

                // Check boss defeated via health
                if (bossActive && bossRef) {
                    if (bossRef.health <= 0) {
                        bossActive = false;
                        bossHpContainer.style.display = 'none';
                        handleBossDrop(bossRef.isBoss);
                        const idx = enemies.indexOf(bossRef);
                        if (idx !== -1) {
                            spawnExplosion(bossRef.x, bossRef.y, '#ff0', 60);
                            enemies.splice(idx, 1);
                        }
                        bossRef = null;
                    }
                }

                // Enemy bullets vs player
                for (let i = enemyBullets.length - 1; i >= 0; i--) {
                    const b = enemyBullets[i];
                    if (player.invincibleTimer > 0) continue;
                    if (dist(b, player) < b.radius + player.radius) {
                        enemyBullets.splice(i, 1);
                        if (player.shield && getPermBonus('shield') > 0) {
                            player.shield = false;
                            player.shieldCooldown = player.shieldMaxCooldown;
                            spawnExplosion(player.x, player.y, '#0ff', 15);
                            playTone(500, 'triangle', 0.1, 0.05);
                            player.invincibleTimer = 0.3;
                        } else {
                            player.health -= b.damage;
                            player.invincibleTimer = 0.8;
                            spawnExplosion(player.x, player.y, '#f44', 12);
                            playNoise(0.1, 0.06);
                            shakeMag = 6;
                            shakeDur = 0.2;
                            if (player.health <= 0 && getPermBonus('extraLife') > 0 && !player.extraLifeUsed) {
                                player.extraLifeUsed = true;
                                player.health = player.maxHealth * 0.5;
                                player.invincibleTimer = 2.0;
                                spawnExplosion(player.x, player.y, '#ffd700', 40);
                                dropTitle.textContent = '🌟 EXTRA LIFE!';
                                dropTitle.style.color = '#ffd700';
                                dropSub.textContent = 'You survived!';
                                dropSub.style.color = '#fff';
                                dropNotif.classList.add('show');
                                clearTimeout(dropNotif._timer);
                                dropNotif._timer = setTimeout(() => { dropNotif.classList.remove('show'); }, 1800);
                                continue;
                            }
                            if (player.health <= 0) {
                                player.health = 0;
                                spawnExplosion(player.x, player.y, '#ff0', 40);
                                gameOverSequence();
                                return;
                            }
                        }
                    }
                }

                // Player ramming enemies
                if (player.invincibleTimer <= 0) {
                    for (const e of enemies) {
                        if (dist(player, e) < player.radius + e.radius) {
                            if (e.isBoss || e.isMini) {
                                player.health -= 30;
                                player.invincibleTimer = 1.5;
                                spawnExplosion(player.x, player.y, '#f84', 20);
                                shakeMag = 10;
                                shakeDur = 0.3;
                            } else {
                                player.health -= 15;
                                player.invincibleTimer = 1.0;
                                spawnExplosion(player.x, player.y, '#f84', 12);
                                shakeMag = 6;
                                shakeDur = 0.2;
                            }
                            if (player.health <= 0 && getPermBonus('extraLife') > 0 && !player.extraLifeUsed) {
                                player.extraLifeUsed = true;
                                player.health = player.maxHealth * 0.5;
                                player.invincibleTimer = 2.0;
                                spawnExplosion(player.x, player.y, '#ffd700', 40);
                                dropTitle.textContent = '🌟 EXTRA LIFE!';
                                dropTitle.style.color = '#ffd700';
                                dropSub.textContent = 'You survived!';
                                dropSub.style.color = '#fff';
                                dropNotif.classList.add('show');
                                clearTimeout(dropNotif._timer);
                                dropNotif._timer = setTimeout(() => { dropNotif.classList.remove('show'); }, 1800);
                                continue;
                            }
                            if (player.health <= 0) {
                                player.health = 0;
                                spawnExplosion(player.x, player.y, '#ff0', 40);
                                gameOverSequence();
                                return;
                            }
                            break;
                        }
                    }
                }

                // Collect powerups
                for (let i = powerUps.length - 1; i >= 0; i--) {
                    const p = powerUps[i];
                    if (dist(player, p) < player.radius + p.radius) {
                        powerUps.splice(i, 1);
                        playPowerup();
                        switch (p.type) {
                            case 'rapidFire':
                                player.rapidFire = true;
                                player.powerupTimers.rapidFire = 5;
                                break;
                            case 'spreadShot':
                                player.spreadShot = true;
                                player.powerupTimers.spreadShot = 5;
                                break;
                            case 'shield':
                                player.shield = true;
                                player.powerupTimers.shield = 6;
                                break;
                            case 'health':
                                player.health = Math.min(player.maxHealth, player.health + 35);
                                break;
                        }
                        spawnExplosion(p.x, p.y, '#ff0', 8);
                    }
                }

                // Particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.life -= dt;
                    if (p.life <= 0) particles.splice(i, 1);
                }

                if (shakeDur > 0) { shakeDur -= dt;
                    shakeMag *= 0.9; } else shakeMag = 0;

                if (bossActive && bossRef) {
                    const pct = Math.max(0, (bossRef.health / bossRef.maxHealth) * 100);
                    bossHpBar.style.width = `${pct}%`;
                }

                updateUI();
                updatePermUpgradesUI();
            }

            // ─── DRAW ───
            function drawStarfield() {
                for (let layer = 0; layer < 3; layer++) {
                    const stars = starsLayers[layer];
                    for (const s of stars) {
                        s.y += s.speed * 0.016;
                        if (s.y > H + 5) { s.y = -5;
                            s.x = Math.random() * W; }
                        ctx.globalAlpha = s.brightness;
                        ctx.fillStyle = '#fff';
                        ctx.beginPath();
                        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                ctx.globalAlpha = 1;
            }

            function drawPlayer() {
                if (gameOver) return;
                const skin = getCurrentSkin();
                ctx.save();
                ctx.translate(player.x, player.y);
                const recoilScale = 1 - player.recoil * 0.025;
                ctx.scale(1, recoilScale);
                if (player.invincibleTimer > 0 && Math.floor(player.invincibleTimer * 10) % 2 === 0) ctx.globalAlpha = 0.4;
                if (player.shield && getPermBonus('shield') > 0) {
                    ctx.beginPath();
                    ctx.arc(0, 0, player.radius + 8, 0, Math.PI * 2);
                    ctx.strokeStyle = skin.accent;
                    ctx.lineWidth = 3;
                    ctx.shadowColor = skin.accent;
                    ctx.shadowBlur = 20;
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }
                ctx.fillStyle = skin.primary;
                ctx.shadowColor = skin.primary;
                ctx.shadowBlur = 12;
                ctx.beginPath();
                if (skin.shape === 'sleek') {
                    ctx.moveTo(0, -player.radius * 1.2);
                    ctx.lineTo(-player.radius * 0.8, player.radius * 0.5);
                    ctx.lineTo(-player.radius * 0.4, player.radius * 0.8);
                    ctx.lineTo(0, player.radius * 0.6);
                    ctx.lineTo(player.radius * 0.4, player.radius * 0.8);
                    ctx.lineTo(player.radius * 0.8, player.radius * 0.5);
                } else if (skin.shape === 'aggressive') {
                    ctx.moveTo(0, -player.radius * 1.3);
                    ctx.lineTo(-player.radius, player.radius * 0.5);
                    ctx.lineTo(-player.radius * 0.6, player.radius * 0.9);
                    ctx.lineTo(0, player.radius * 0.7);
                    ctx.lineTo(player.radius * 0.6, player.radius * 0.9);
                    ctx.lineTo(player.radius, player.radius * 0.5);
                } else {
                    ctx.moveTo(0, -player.radius);
                    ctx.lineTo(-player.radius, player.radius * 0.6);
                    ctx.lineTo(player.radius, player.radius * 0.6);
                }
                ctx.closePath();
                ctx.fill();
                if (player.recoil > 0.5) {
                    ctx.shadowBlur = 25;
                    ctx.shadowColor = skin.engine;
                    ctx.fillStyle = skin.engine;
                    ctx.globalAlpha = 0.6;
                    ctx.beginPath();
                    ctx.moveTo(-4, player.radius * 0.6);
                    ctx.lineTo(0, player.radius * 0.9 + player.recoil * 3);
                    ctx.lineTo(4, player.radius * 0.6);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                    ctx.shadowBlur = 0;
                }
                ctx.fillStyle = skin.accent;
                ctx.shadowColor = skin.accent;
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(0, player.radius * 0.3, player.radius * 0.3, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.restore();
            }

            function drawBulletTrails() {
                for (const t of bulletTrails) {
                    const alpha = t.life / t.maxLife;
                    ctx.globalAlpha = alpha * 0.7;
                    ctx.fillStyle = t.color;
                    ctx.shadowColor = t.color;
                    ctx.shadowBlur = 8;
                    ctx.beginPath();
                    ctx.arc(t.x, t.y, t.size * alpha, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
            }

            function drawBullets() {
                ctx.shadowBlur = 8;
                for (const b of playerBullets) {
                    const skin = getCurrentSkin();
                    const grad = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.radius * 3);
                    grad.addColorStop(0, skin.accent);
                    grad.addColorStop(0.3, skin.primary);
                    grad.addColorStop(1, 'rgba(255,170,0,0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.radius * 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.shadowColor = skin.accent;
                    ctx.shadowBlur = 15;
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = skin.accent;
                    ctx.shadowBlur = 20;
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.radius * 0.6, 0, Math.PI * 2);
                    ctx.fill();
                }
                for (const b of enemyBullets) {
                    ctx.fillStyle = b.color || '#f44';
                    ctx.shadowColor = '#f44';
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.shadowBlur = 15;
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.radius * 0.4, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.shadowBlur = 0;
            }

            function drawEnemies() {
                for (const e of enemies) {
                    ctx.save();
                    ctx.translate(e.x, e.y);
                    ctx.shadowColor = e.color;
                    ctx.shadowBlur = 12;
                    ctx.fillStyle = e.color;
                    if (e.isBoss || e.isMini) {
                        e.angle = (e.angle || 0) + 0.015;
                        ctx.rotate(e.angle);
                        const n = e.isBoss ? 8 : 6;
                        ctx.beginPath();
                        for (let i = 0; i < n; i++) {
                            const a = (i / n) * Math.PI * 2;
                            const r = e.radius * (i % 2 === 0 ? 1 : 0.7);
                            const x = Math.cos(a) * r,
                                y = Math.sin(a) * r;
                            if (i === 0) ctx.moveTo(x, y);
                            else ctx.lineTo(x, y);
                        }
                        ctx.closePath();
                        ctx.fill();
                        ctx.rotate(-e.angle);
                        ctx.shadowBlur = 0;
                        const bw = e.radius * 1.6;
                        const bh = 4;
                        const bx = -bw / 2;
                        const by = -e.radius - 12;
                        ctx.fillStyle = 'rgba(0,0,0,0.7)';
                        ctx.fillRect(bx, by, bw, bh);
                        const hpPct = Math.max(0, e.health / e.maxHealth);
                        ctx.fillStyle = e.isBoss ? '#f44' : '#f80';
                        ctx.fillRect(bx, by, bw * hpPct, bh);
                        ctx.fillStyle = '#fff';
                        ctx.font = '8px monospace';
                        ctx.textAlign = 'center';
                        ctx.fillText(e.isBoss ? '★ BOSS' : '⚔ MINI', 0, by - 4);
                    } else {
                        ctx.beginPath();
                        ctx.arc(0, 0, e.radius, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.restore();
                }
            }

            function drawPowerUps() {
                for (const p of powerUps) {
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#ff0';
                    ctx.fillStyle = '#ff0';
                    ctx.beginPath();
                    ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#000';
                    ctx.font = 'bold 11px monospace';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    let letter = '?';
                    if (p.type === 'rapidFire') letter = 'R';
                    else if (p.type === 'spreadShot') letter = 'S';
                    else if (p.type === 'shield') letter = 'H';
                    else if (p.type === 'health') letter = '+';
                    ctx.fillText(letter, 0, 0);
                    ctx.restore();
                }
            }

            function drawParticles() {
                ctx.shadowBlur = 4;
                for (const p of particles) {
                    const alpha = p.life / p.maxLife;
                    ctx.globalAlpha = alpha;
                    ctx.fillStyle = p.color;
                    ctx.shadowColor = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
            }

            function render() {
                ctx.clearRect(0, 0, W, H);
                let sx = 0,
                    sy = 0;
                if (shakeMag > 0.5) {
                    sx = (Math.random() - 0.5) * shakeMag * 2;
                    sy = (Math.random() - 0.5) * shakeMag * 2;
                }
                ctx.save();
                ctx.translate(sx, sy);
                drawStarfield();
                drawPowerUps();
                drawBulletTrails();
                drawBullets();
                drawEnemies();
                drawPlayer();
                drawParticles();
                ctx.restore();
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.font = '11px monospace';
                ctx.textAlign = 'right';
                ctx.fillText(`HIGH: ${highScore}`, W - 14, 26);
                ctx.textAlign = 'left';
                ctx.fillStyle = 'rgba(255,215,0,0.3)';
                ctx.font = '10px monospace';
                ctx.fillText(`LVL ${level}`, 14, H - 14);
                const remaining = enemies.length;
                ctx.textAlign = 'right';
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.fillText(`ENEMIES: ${remaining}`, W - 14, H - 14);
            }

            // ─── LOOP ───
            let lastTime = performance.now();

            function gameLoop(now) {
                const dt = (now - lastTime) / 1000;
                lastTime = now;
                update(dt);
                render();
                requestAnimationFrame(gameLoop);
            }

            // ─── KEYBOARD ───
            window.addEventListener('keydown', function(e) {
                if (e.key === 'r' || e.key === 'R') { if (gameOver) restartGame(); }
                if (e.key === 'b' || e.key === 'B') { if (!gameOver && !isNameInputOpen) window.toggleShop(); }
                if (e.key === 'l' || e.key === 'L') { if (!gameOver && !isNameInputOpen) window.toggleLeaderboard(); }
                if (e.key === 'm' || e.key === 'M') { window.toggleMute(); }
                if (e.key === 'Escape') {
                    if (isNameInputOpen) window._cancelNameInput();
                    else if (isLeaderboardOpen) window.toggleLeaderboard();
                    else if (isShopOpen) window.toggleShop();
                }
            });

            window.toggleFullscreen = function() {
                const el = document.documentElement;
                if (!document.fullscreenElement) el.requestFullscreen().catch(() => {});
                else document.exitFullscreen();
            };

            // ─── INIT ───
            applyAllUpgrades();
            startLevel(level);
            updateUI();
            updatePermUpgradesUI();
            setTimeout(() => { initAudioSafe(); }, 100);
            lastTime = performance.now();
            requestAnimationFrame(gameLoop);

            window.addEventListener('resize', () => {
                player.x = clamp(player.x, player.radius, W - player.radius);
                player.y = clamp(player.y, player.radius, H - player.radius);
            });

            window._purchaseShop = function(key) {
                if (purchaseShopUpgrade(key)) {
                    if (key === 'health') player.health = Math.min(player.maxHealth, player.health + 10);
                    updateUI();
                    updateShopUI();
                }
            };
            window.toggleShop = window.toggleShop;
            window.toggleLeaderboard = window.toggleLeaderboard;
            window.toggleMute = window.toggleMute;

            console.log('🛸 Nebula Drift – Infinite Levels');
            console.log('⚡ ULTRA RESPONSIVE - Direct positioning, no lag!');
            console.log('🖱️ Mouse follows cursor anywhere on screen');
            console.log('🎮 Touch/Keyboard also supported');
            console.log('🛒 B = Shop | L = Leaderboard | M = Mute');
        })();
    </script>
</body>
</html>
