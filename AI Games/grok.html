<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07081a" />
  <meta name="description" content="The Path of Wisdom — a journey through choices in the Archive of Wisdom." />
  <title>THE PATH OF WISDOM</title>
  <style>
/* ============================================================
   THE PATH OF WISDOM — Mysterious Digital Archive
   Palette: deep navy, near-black blue, muted purple, soft cyan
   ============================================================ */

:root {
  --navy-0: #050612;
  --navy-1: #07081a;
  --navy-2: #0c1028;
  --navy-3: #14183a;
  --purple: #6b5b8a;
  --purple-soft: #8a78a8;
  --cyan: #7ec8d4;
  --cyan-dim: #4a8f9a;
  --cyan-glow: rgba(126, 200, 212, 0.35);
  --text: #e8eef2;
  --text-dim: #b7c2cc;
  --text-mute: #8a96a3;
  --glass: rgba(16, 20, 48, 0.62);
  --glass-border: rgba(126, 200, 212, 0.22);
  --danger: #c9a0a8;
  --focus: #9be7f0;
  --shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
  --radius: 18px;
  --font-serif: Georgia, "Palatino Linotype", Palatino, "Times New Roman", serif;
  --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
  --reduce-motion: 0;
}

@media (prefers-reduced-motion: reduce) {
  :root { --reduce-motion: 1; }
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: var(--navy-0);
  color: var(--text);
  font-family: var(--font-sans);
  overflow-x: hidden;
}

body {
  min-height: 100dvh;
  background:
    radial-gradient(ellipse at 20% 0%, rgba(90, 60, 130, 0.22), transparent 50%),
    radial-gradient(ellipse at 80% 100%, rgba(40, 90, 110, 0.18), transparent 55%),
    linear-gradient(180deg, #050612 0%, #090b1e 50%, #07081a 100%);
}

.skip-link {
  position: absolute;
  left: 12px;
  top: -48px;
  z-index: 100;
  background: var(--navy-3);
  color: var(--text);
  padding: 8px 14px;
  border-radius: 8px;
}
.skip-link:focus { top: 12px; }

#particle-canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

.fog {
  position: fixed;
  inset: -20%;
  z-index: 1;
  pointer-events: none;
  background: radial-gradient(circle at 30% 40%, rgba(80, 70, 120, 0.14), transparent 45%);
  animation: drift 48s ease-in-out infinite alternate;
}
.fog-b {
  background: radial-gradient(circle at 70% 70%, rgba(50, 100, 120, 0.12), transparent 50%);
  animation-duration: 62s;
  animation-direction: alternate-reverse;
}

@keyframes drift {
  from { transform: translate3d(-3%, -2%, 0) scale(1); }
  to { transform: translate3d(4%, 3%, 0) scale(1.08); }
}

.sigil-field {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  opacity: 0.18;
  background-image:
    linear-gradient(rgba(126, 200, 212, 0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(126, 200, 212, 0.06) 1px, transparent 1px);
  background-size: 72px 72px;
  mask-image: radial-gradient(ellipse at center, black 30%, transparent 78%);
}

.app {
  position: relative;
  z-index: 2;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  max-width: 920px;
  margin: 0 auto;
  padding: 16px 18px 40px;
}

.topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  padding: 8px 4px 18px;
}
.topbar[hidden] { display: none !important; }

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  letter-spacing: 0.22em;
  font-size: 0.72rem;
  color: var(--cyan);
}
.brand-mark {
  display: inline-grid;
  place-items: center;
  width: 22px;
  height: 22px;
  border: 1px solid var(--glass-border);
  color: var(--cyan);
  font-size: 12px;
}
.brand-title { font-family: var(--font-serif); font-weight: 400; }

.progress {
  margin: 0 auto 0 8px;
  font-size: 0.72rem;
  letter-spacing: 0.18em;
  color: var(--text-mute);
}

.top-actions {
  display: flex;
  gap: 8px;
  margin-left: auto;
}

.icon-btn, .path-btn, .primary-btn, .ghost-btn, .text-btn {
  font-family: var(--font-sans);
  cursor: pointer;
  border: 1px solid var(--glass-border);
  background: rgba(12, 16, 40, 0.55);
  color: var(--text);
  letter-spacing: 0.12em;
  transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
}

.icon-btn {
  font-size: 0.65rem;
  padding: 8px 10px;
  border-radius: 999px;
  color: var(--cyan);
}

.icon-btn:hover, .ghost-btn:hover, .path-btn:hover, .primary-btn:hover {
  border-color: rgba(126, 200, 212, 0.55);
  box-shadow: 0 0 0 1px rgba(126, 200, 212, 0.12), 0 0 24px rgba(126, 200, 212, 0.08);
}

.icon-btn:focus-visible,
.path-btn:focus-visible,
.primary-btn:focus-visible,
.ghost-btn:focus-visible,
.text-btn:focus-visible,
select:focus-visible,
input:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 3px;
}

.stage {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.screen {
  animation: rise 0.7s ease both;
}
.screen.fade-out {
  animation: fadeOut 0.45s ease both;
}

@keyframes rise {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: none; }
}
@keyframes fadeOut {
  to { opacity: 0; transform: translateY(-8px); }
}

.glass {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  backdrop-filter: blur(16px);
}

/* Title */
.title-screen {
  text-align: center;
  padding: 48px 18px 24px;
}
.sigil {
  width: 84px;
  height: 84px;
  margin: 0 auto 28px;
  position: relative;
}
.sigil::before, .sigil::after {
  content: "";
  position: absolute;
  inset: 0;
  border: 1px solid rgba(126, 200, 212, 0.45);
  transform: rotate(45deg);
}
.sigil::after {
  inset: 12px;
  border-color: rgba(138, 120, 168, 0.6);
  animation: pulseRing 6s ease-in-out infinite;
}
.sigil span {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: var(--cyan);
  font-size: 22px;
}
@keyframes pulseRing {
  0%, 100% { opacity: 0.45; transform: rotate(45deg) scale(1); }
  50% { opacity: 1; transform: rotate(45deg) scale(1.06); }
}

.game-title {
  font-family: var(--font-serif);
  font-weight: 400;
  font-size: clamp(2rem, 7vw, 3.6rem);
  letter-spacing: 0.18em;
  margin: 0 0 10px;
  line-height: 1.2;
  text-shadow: 0 0 40px rgba(126, 200, 212, 0.18);
}
.subtitle {
  letter-spacing: 0.34em;
  font-size: 0.78rem;
  color: var(--cyan);
  margin: 0 0 28px;
}
.epigraph {
  font-family: var(--font-serif);
  font-style: italic;
  color: var(--text-dim);
  max-width: 28rem;
  margin: 0 auto 40px;
  line-height: 1.7;
}

.btn-stack {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.primary-btn {
  min-width: min(320px, 86vw);
  padding: 16px 22px;
  border-radius: 999px;
  letter-spacing: 0.22em;
  font-size: 0.78rem;
  background: linear-gradient(180deg, rgba(40, 60, 90, 0.7), rgba(16, 20, 48, 0.8));
  color: var(--text);
}
.ghost-btn {
  min-width: min(320px, 86vw);
  padding: 12px 22px;
  border-radius: 999px;
  letter-spacing: 0.2em;
  font-size: 0.72rem;
  background: transparent;
  color: var(--text-dim);
}
.text-btn {
  background: none;
  border: none;
  color: var(--cyan);
  letter-spacing: 0.14em;
  font-size: 0.72rem;
  padding: 8px;
}

.voice-dock {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 28px;
  flex-wrap: wrap;
}

/* Intro */
.intro-screen {
  text-align: center;
  padding: 64px 16px;
  min-height: 60vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.intro-line {
  font-family: var(--font-serif);
  letter-spacing: 0.28em;
  font-size: clamp(0.95rem, 3vw, 1.25rem);
  color: var(--cyan);
  min-height: 2em;
  opacity: 0;
}
.intro-line.show { animation: rise 0.9s ease both; }
.oracle-name {
  font-family: var(--font-serif);
  letter-spacing: 0.4em;
  font-size: clamp(1.4rem, 5vw, 2.2rem);
  margin: 8px 0 28px;
}
.oracle-speech {
  font-family: var(--font-serif);
  font-size: clamp(1.05rem, 2.6vw, 1.35rem);
  line-height: 1.75;
  color: var(--text);
  max-width: 34rem;
  margin: 0 auto 18px;
}
.oracle-speech + .oracle-speech { color: var(--text-dim); }

/* Scenario */
.location {
  text-align: center;
  letter-spacing: 0.32em;
  font-size: 0.78rem;
  color: var(--cyan);
  margin: 8px 0 22px;
}
.scene-card {
  padding: 28px 26px 22px;
  margin-bottom: 22px;
}
.scene-text {
  font-family: var(--font-serif);
  font-size: clamp(1.02rem, 2.4vw, 1.2rem);
  line-height: 1.75;
  color: var(--text);
  margin: 0 0 16px;
}
.scene-text p { margin: 0 0 14px; }
.scene-text p:last-child { margin-bottom: 0; }
.choose-label {
  text-align: center;
  letter-spacing: 0.28em;
  font-size: 0.68rem;
  color: var(--text-mute);
  margin: 8px 0 14px;
}
.choices {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
.path-btn {
  text-align: left;
  padding: 18px 18px 16px;
  border-radius: 14px;
  min-height: 118px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.path-btn:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}
.path-kicker {
  font-size: 0.66rem;
  letter-spacing: 0.22em;
  color: var(--cyan);
}
.path-label {
  font-family: var(--font-serif);
  letter-spacing: 0.01em;
  font-size: 1rem;
  line-height: 1.45;
  color: var(--text);
}

.consequence-card .chosen {
  font-size: 0.78rem;
  letter-spacing: 0.16em;
  color: var(--cyan);
  margin-bottom: 10px;
}
.oracle-box {
  margin-top: 18px;
  padding-top: 16px;
  border-top: 1px solid rgba(126, 200, 212, 0.16);
}
.oracle-kicker {
  letter-spacing: 0.3em;
  font-size: 0.64rem;
  color: var(--purple-soft);
  margin-bottom: 8px;
}
.oracle-line {
  font-family: var(--font-serif);
  font-style: italic;
  font-size: 1.08rem;
  line-height: 1.7;
  color: var(--text-dim);
}

/* Oracle Sphere + circular waveform */
.oracle-presence {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  margin: 4px auto 14px;
  width: min(320px, 86vw);
  min-height: 210px;
}
.oracle-presence[hidden] { display: none !important; }
.oracle-wave {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 210px;
  pointer-events: none;
}
.oracle-sphere {
  position: relative;
  width: 118px;
  height: 118px;
  border-radius: 50%;
  margin-top: 46px;
  background:
    radial-gradient(circle at 35% 28%, rgba(180, 220, 230, 0.28), transparent 38%),
    radial-gradient(circle at 50% 55%, rgba(70, 50, 110, 0.55), rgba(8, 10, 28, 0.92) 70%);
  border: 1px solid rgba(126, 200, 212, 0.38);
  box-shadow:
    0 0 24px rgba(126, 200, 212, 0.16),
    0 0 48px rgba(90, 70, 140, 0.16),
    inset 0 0 22px rgba(126, 200, 212, 0.12);
  overflow: hidden;
}
.oracle-sphere::before,
.oracle-sphere::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  border: 1px solid rgba(126, 200, 212, 0.18);
  inset: 14px;
}
.oracle-sphere::after {
  inset: 28px;
  border-color: rgba(138, 120, 168, 0.35);
}
.oracle-core {
  position: absolute;
  inset: 38px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(190, 230, 236, 0.55), rgba(80, 60, 130, 0.15) 62%, transparent 70%);
  animation: sphereBreath 4.6s ease-in-out infinite;
}
.oracle-glyph {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: rgba(196, 236, 240, 0.72);
  font-size: 20px;
  letter-spacing: 0;
  text-shadow: 0 0 12px rgba(126, 200, 212, 0.45);
}
.oracle-presence[data-state="speaking"] .oracle-sphere {
  box-shadow:
    0 0 36px rgba(126, 200, 212, 0.34),
    0 0 70px rgba(90, 70, 140, 0.28),
    inset 0 0 28px rgba(126, 200, 212, 0.2);
}
.oracle-presence[data-state="speaking"] .oracle-core {
  animation: sphereSpeak 0.9s ease-in-out infinite;
}
.oracle-presence[data-state="thinking"] .oracle-sphere {
  box-shadow:
    0 0 28px rgba(138, 120, 168, 0.28),
    inset 0 0 24px rgba(126, 200, 212, 0.1);
}
.oracle-presence[data-state="choose"] .oracle-sphere {
  animation: sphereChoose 1.4s ease-out 1;
}
@keyframes sphereBreath {
  0%, 100% { transform: scale(1); opacity: 0.72; }
  50% { transform: scale(1.08); opacity: 1; }
}
@keyframes sphereSpeak {
  0%, 100% { transform: scale(1); opacity: 0.7; }
  50% { transform: scale(1.16); opacity: 1; }
}
@keyframes sphereChoose {
  0% { transform: scale(1); }
  35% { transform: scale(1.08); box-shadow: 0 0 50px rgba(126, 200, 212, 0.45); }
  100% { transform: scale(1); }
}
.reflect-box {
  margin-top: 8px;
  min-height: 38px;
  text-align: center;
}
.reflect-box[hidden] { display: none !important; }
.reflect-label {
  margin: 0 0 6px;
  letter-spacing: 0.34em;
  font-size: 0.68rem;
  color: var(--purple-soft);
}
.reflect-track {
  width: 120px;
  height: 2px;
  margin: 0 auto;
  background: rgba(126, 200, 212, 0.16);
  overflow: hidden;
}
.reflect-fill {
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, var(--purple-soft), var(--cyan));
  animation: reflectFill 3s linear forwards;
}
@keyframes reflectFill {
  from { width: 0; }
  to { width: 100%; }
}
.choose-line {
  font-family: var(--font-serif);
  font-style: italic;
  color: var(--cyan);
  letter-spacing: 0.06em;
  margin: 4px 0 0;
  min-height: 1.4em;
}
.choice-panel[hidden] { display: none !important; }
.choice-panel.is-locked .path-btn {
  pointer-events: none;
  opacity: 0.38;
}

@media (max-width: 720px) {
  .oracle-presence { width: min(260px, 92vw); min-height: 180px; }
  .oracle-wave { height: 180px; }
  .oracle-sphere { width: 96px; height: 96px; margin-top: 38px; }
}

.continue-wrap {
  display: flex;
  justify-content: center;
  margin-top: 22px;
}

/* Ending */
.ending-screen { text-align: center; padding: 20px 8px 40px; }
.ending-sigil {
  width: 96px;
  height: 96px;
  margin: 10px auto 28px;
  border-radius: 50%;
  border: 1px solid rgba(126, 200, 212, 0.4);
  box-shadow: 0 0 40px rgba(126, 200, 212, 0.18), inset 0 0 30px rgba(126, 200, 212, 0.08);
  display: grid;
  place-items: center;
  color: var(--cyan);
  font-size: 28px;
  animation: glow 4.5s ease-in-out infinite;
}
@keyframes glow {
  0%, 100% { box-shadow: 0 0 24px rgba(126, 200, 212, 0.12); }
  50% { box-shadow: 0 0 48px rgba(126, 200, 212, 0.28); }
}
.ending-name {
  font-family: var(--font-serif);
  letter-spacing: 0.28em;
  font-size: clamp(1.2rem, 4vw, 1.7rem);
  margin: 0 0 18px;
}
.final-q {
  letter-spacing: 0.3em;
  color: var(--cyan);
  font-size: 0.78rem;
  margin-bottom: 10px;
}

/* Modal */
.modal-root {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: grid;
  place-items: center;
  padding: 18px;
}
.modal-root[hidden] { display: none !important; }
.modal-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(3, 4, 12, 0.72);
}
.modal {
  position: relative;
  width: min(640px, 100%);
  max-height: min(82vh, 760px);
  overflow: auto;
  padding: 18px 18px 22px;
}
.modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}
.modal-head h2 {
  margin: 0;
  font-family: var(--font-serif);
  font-weight: 400;
  letter-spacing: 0.2em;
  font-size: 1rem;
}
.modal-body { color: var(--text-dim); line-height: 1.65; font-size: 0.95rem; }

.settings-grid {
  display: grid;
  gap: 16px;
}
.setting {
  display: grid;
  gap: 8px;
}
.setting label {
  letter-spacing: 0.16em;
  font-size: 0.72rem;
  color: var(--cyan);
}
.setting select, .setting input[type="range"] {
  width: 100%;
  accent-color: var(--cyan);
}
.setting select {
  background: var(--navy-2);
  color: var(--text);
  border: 1px solid var(--glass-border);
  border-radius: 10px;
  padding: 10px;
}
.toggle-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.toggle-row button[aria-pressed="true"] {
  border-color: var(--cyan);
  color: var(--cyan);
  background: rgba(126, 200, 212, 0.1);
}

.journal-entry {
  border-top: 1px solid rgba(126, 200, 212, 0.12);
  padding: 14px 0;
}
.journal-entry h3 {
  margin: 0 0 6px;
  font-size: 0.78rem;
  letter-spacing: 0.16em;
  color: var(--cyan);
  font-weight: 500;
}
.journal-empty { font-family: var(--font-serif); font-style: italic; }

.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%);
  z-index: 40;
  background: rgba(12, 16, 40, 0.92);
  border: 1px solid var(--glass-border);
  color: var(--text);
  padding: 10px 16px;
  border-radius: 999px;
  letter-spacing: 0.12em;
  font-size: 0.72rem;
}
.toast[hidden] { display: none !important; }

.confirm-row {
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  margin-top: 16px;
  flex-wrap: wrap;
}

.credits p { margin: 0 0 10px; }
.credits .quiet { color: var(--text-mute); font-size: 0.86rem; }

@media (max-width: 720px) {
  .choices { grid-template-columns: 1fr; }
  .path-btn { min-height: 0; }
  .progress { margin: 0; width: 100%; order: 3; }
  .topbar { align-items: flex-start; }
  .scene-card { padding: 20px 16px; }
}

@media (max-width: 420px) {
  .app { padding: 10px 12px 28px; }
  .game-title { letter-spacing: 0.1em; }
  .top-actions .icon-btn { padding: 8px 8px; letter-spacing: 0.08em; }
}

  </style>
</head>
<body>
  <a class="skip-link" href="#app">Skip to game</a>
  <canvas id="particle-canvas" aria-hidden="true"></canvas>
  <div class="fog fog-a" aria-hidden="true"></div>
  <div class="fog fog-b" aria-hidden="true"></div>
  <div class="sigil-field" aria-hidden="true"></div>

  <div id="app" class="app">
    <header class="topbar" id="topbar" hidden>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">◇</span>
        <span class="brand-title">THE PATH OF WISDOM</span>
      </div>
      <p class="progress" id="progress-label" aria-live="polite">TRIAL — / 20</p>
      <nav class="top-actions" aria-label="Game actions">
        <button type="button" class="icon-btn" id="btn-journal" aria-label="Open journal">JOURNAL</button>
        <button type="button" class="icon-btn" id="btn-save" aria-label="Save journey">SAVE</button>
        <button type="button" class="icon-btn" id="btn-settings" aria-label="Open settings">SETTINGS</button>
      </nav>
    </header>

    <div id="oracle-presence" class="oracle-presence" data-state="idle" hidden>
      <canvas id="oracle-wave" class="oracle-wave" aria-hidden="true"></canvas>
      <div class="oracle-sphere" aria-hidden="true">
        <div class="oracle-core"></div>
        <div class="oracle-glyph">◇</div>
      </div>

function chooseEnding(stats) {
  const virtue = stats.wisdom + stats.compassion + stats.honesty + stats.courage;
  const weight = virtue - stats.selfishness * 1.35;
  if (stats.selfishness >= 14 && weight < 8) return ENDING_RULES.lost;

}

const state = {
  screen: "title",
  trialIndex: 0,
  stats: { ...STAT_DEFAULTS },
  flags: [],
  journal: [],
  lastChoiceKey: null,
  awaitingContinue: false,
  endingId: null,
  finalAnswer: null,
  lastSpoken: "",
  settings: {
    voice: { ...VOICE_DEFAULTS },
    music: { ...MUSIC_DEFAULTS }
  }
};

/* ---------------------------------------------------------------------------
   AUDIO / VOICE
   --------------------------------------------------------------------------- */
const music = {
  el: null,
  ready: false,
  missing: false,
  targetVolume: MUSIC_DEFAULTS.volume,
  ducked: false
};

function initMusic() {
  const el = new Audio();
  el.loop = true;
  el.preload = "auto";
  el.src = GAME_SETTINGS.musicSrc;
  el.volume = state.settings.music.volume;
  el.addEventListener("canplaythrough", () => { music.ready = true; }, { once: true });
  el.addEventListener("error", () => { music.missing = true; music.ready = false; });
  music.el = el;
}

function playMusic() {
  if (!state.settings.music.enabled || music.missing || !music.el) return;
  music.el.volume = music.ducked
    ? state.settings.music.volume * GAME_SETTINGS.musicDuckedRatio
    : state.settings.music.volume;
  const p = music.el.play();
  if (p && typeof p.catch === "function") p.catch(() => {});
}

function pauseMusic() {
  if (music.el) music.el.pause();
}

function fadeMusicTo(vol, ms) {
  if (!music.el || music.missing) return;
  const start = music.el.volume;
  const dest = Math.max(0, Math.min(1, vol));
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches || ms < 40) {
    music.el.volume = dest;
    return;
  }
  const t0 = performance.now();
  function step(now) {
    const k = Math.min(1, (now - t0) / ms);
    music.el.volume = start + (dest - start) * k;
    if (k < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function duckMusic() {
  if (!state.settings.music.enabled || !music.el || music.missing) return;
  music.ducked = true;
  fadeMusicTo(state.settings.music.volume * GAME_SETTINGS.musicDuckedRatio, 280);
}

function unduckMusic() {
  if (!music.el || music.missing) return;
  music.ducked = false;
  if (!state.settings.music.enabled) return;
  fadeMusicTo(state.settings.music.volume, GAME_SETTINGS.musicRestoreMs);
}

function stopMusicFade() {
  if (!music.el) return;
  fadeMusicTo(0, 700);
  setTimeout(() => { if (music.el) music.el.pause(); }, 720);
}

let voicesCache = [];
function loadVoices() {
  if (!("speechSynthesis" in window)) return [];
  voicesCache = window.speechSynthesis.getVoices() || [];
  return voicesCache;
}

function preferredVoice() {
  const list = loadVoices();
  if (!list.length) return null;
  const saved = state.settings.voice.voiceURI;
  if (saved) {
    const found = list.find((v) => v.voiceURI === saved);
    if (found) return found;
  }
  const scored = list.map((v) => {
    const n = (v.name || "").toLowerCase();
    let s = 0;
    if (v.lang && v.lang.toLowerCase().startsWith("en")) s += 3;
    if (/male|daniel|fred|alex|david|george|james|thomas|reed/.test(n)) s += 2;
    if (/calm|soft|narrat|story|premium|natural|neural/.test(n)) s += 2;
    if (/google uk english male|microsoft david|microsoft guy/.test(n)) s += 3;
    if (v.default) s += 1;
    return { v, s };
  });
  scored.sort((a, b) => b.s - a.s);
  return scored[0].v;
}

function canSpeak() {
  return typeof window !== "undefined" && "speechSynthesis" in window && state.settings.voice.enabled;
}

/* ---------------------------------------------------------------------------
   ORACLE STATES + AUDIO-REACTIVE SPHERE
   SpeechSynthesis cannot be reliably routed into an AnalyserNode.
   We drive a speech-synced envelope from utterance timing and text rhythm,
   and use Web Audio only if a future capture path appears.
   --------------------------------------------------------------------------- */
const ORACLE_STATES = {
  IDLE: "idle",
  SPEAKING: "speaking",
  THINKING: "thinking",
  CHOOSING: "choosing",
  CHOOSE: "choose"
};

const oracleViz = {
  state: ORACLE_STATES.IDLE,
  energy: 0.08,
  target: 0.08,
  phrase: "",
  t0: 0,
  speaking: false,
  raf: 0,
  bars: 56,
  seqToken: 0,
  thinkTimer: 0,
  speechTimer: 0,
  scenarioLocked: false
};

function showOraclePresence(show) {
  const el = document.getElementById("oracle-presence");
  if (!el) return;
  el.hidden = !show;
  if (show) resizeOracleWave();
}

function setOracleState(next) {
  oracleViz.state = next;
  const el = document.getElementById("oracle-presence");
  if (el) el.setAttribute("data-state", next);
  if (next === ORACLE_STATES.IDLE || next === ORACLE_STATES.CHOOSING) {
    oracleViz.target = 0.08;
    oracleViz.speaking = false;
  } else if (next === ORACLE_STATES.THINKING) {
    oracleViz.target = 0.16;
    oracleViz.speaking = false;
  } else if (next === ORACLE_STATES.SPEAKING || next === ORACLE_STATES.CHOOSE) {
    oracleViz.speaking = true;
    oracleViz.target = next === ORACLE_STATES.CHOOSE ? 0.72 : 0.55;
  }
}

function showReflect(on) {
  const box = document.getElementById("reflect-box");
  const fill = document.getElementById("reflect-fill");
  if (!box) return;
  box.hidden = !on;
  if (on && fill) {
    fill.style.animation = "none";
    void fill.offsetWidth;
    fill.style.animation = "reflectFill 3s linear forwards";
  }
}

function showChooseLine(on) {
  const line = document.getElementById("choose-line");
  if (line) line.hidden = !on;
}

function estimateSpeechMs(text, rate) {
  const words = String(text || "").trim().split(/\s+/).filter(Boolean).length;
  const wps = 2.55 * (rate || 1);
  return Math.max(900, Math.round((words / Math.max(0.6, wps)) * 1000) + 350);
}

function speechEnvelope(now) {
  if (!oracleViz.speaking) return oracleViz.state === ORACLE_STATES.THINKING ? 0.14 : 0.07;
  const elapsed = (now - oracleViz.t0) / 1000;
  const phrase = oracleViz.phrase || "";
  const n = Math.max(8, phrase.length);
  const idx = Math.min(n - 1, Math.floor((elapsed * 12) % n));
  const ch = phrase.charCodeAt(idx % n) || 65;
  const vowelBoost = /[aeiouAEIOU ,.—]/.test(phrase.charAt(idx % n)) ? 0.35 : 0.12;
  const pulse = 0.38 + 0.38 * Math.abs(Math.sin(elapsed * 7.2 + ch)) + vowelBoost * Math.abs(Math.sin(elapsed * 13.1));
  return Math.min(1, pulse);
}

function resizeOracleWave() {
  const canvas = document.getElementById("oracle-wave");
  if (!canvas) return;
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = Math.max(1, Math.floor(rect.width * dpr));
  canvas.height = Math.max(1, Math.floor(rect.height * dpr));
}

function updateOracleVisualizer(now) {
  const canvas = document.getElementById("oracle-wave");
  if (!canvas || canvas.parentElement.hidden) return;
  const ctx = canvas.getContext("2d");
  if (!ctx) return;
  const w = canvas.width;
  const h = canvas.height;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  ctx.clearRect(0, 0, w, h);
  const env = speechEnvelope(now || performance.now());
  oracleViz.energy += (Math.max(oracleViz.target, env) - oracleViz.energy) * 0.18;
  const cx = w / 2;
  const cy = h / 2 + 8 * dpr;
  const radius = Math.min(w, h) * 0.28;
  const bars = oracleViz.bars;
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  for (let i = 0; i < bars; i++) {
    const a = (i / bars) * Math.PI * 2 - Math.PI / 2;
    const wobble = reduce ? 0.15 : Math.abs(Math.sin(i * 0.55 + (now || 0) / 240));
    const amp = (0.22 + oracleViz.energy * 0.95) * (0.45 + wobble);
    const len = (10 + amp * 26) * dpr;
    const inner = radius + 6 * dpr;
    const x0 = cx + Math.cos(a) * inner;
    const y0 = cy + Math.sin(a) * inner;
    const x1 = cx + Math.cos(a) * (inner + len);
    const y1 = cy + Math.sin(a) * (inner + len);
    ctx.strokeStyle = `rgba(126, 200, 212, ${0.18 + oracleViz.energy * 0.55})`;
    ctx.lineWidth = Math.max(1, 1.4 * dpr);
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.strokeStyle = `rgba(138, 120, 168, ${0.12 + oracleViz.energy * 0.25})`;
  ctx.lineWidth = Math.max(1, 1.1 * dpr);
  ctx.arc(cx, cy, radius + (18 + oracleViz.energy * 10) * dpr, 0, Math.PI * 2);
  ctx.stroke();
}

function startOracleVisualizer() {
  if (oracleViz.raf) return;
  resizeOracleWave();
  window.addEventListener("resize", resizeOracleWave);
  function loop(now) {
    updateOracleVisualizer(now);
    oracleViz.raf = requestAnimationFrame(loop);
  }
  oracleViz.raf = requestAnimationFrame(loop);
}

function cancelOracleSequence() {
  oracleViz.seqToken += 1;
  oracleViz.scenarioLocked = false;
  clearTimeout(oracleViz.thinkTimer);
  clearTimeout(oracleViz.speechTimer);
  showReflect(false);
  showChooseLine(false);
}

function speak(text, opts) {
  opts = opts || {};
  state.lastSpoken = text || "";
  const token = opts.token != null ? opts.token : oracleViz.seqToken;
  let finished = false;
  const done = () => {
    if (finished) return;
    if (token !== oracleViz.seqToken && !opts.ignoreToken) return;
    finished = true;
    clearTimeout(oracleViz.speechTimer);
    oracleViz.speaking = false;
    if (!opts.keepDucked) unduckMusic();
    if (opts.onEnd) opts.onEnd();
  };
  if (!text) { done(); return; }

  oracleViz.phrase = text;
  oracleViz.t0 = performance.now();
  if (opts.visualState) setOracleState(opts.visualState);
  else setOracleState(ORACLE_STATES.SPEAKING);

  if (!("speechSynthesis" in window) || !state.settings.voice.enabled) {
    if (!opts.keepDucked) { /* stay */ }
    else duckMusic();
    clearTimeout(oracleViz.speechTimer);
    oracleViz.speechTimer = setTimeout(done, opts.silentHold || 400);
    return;
  }

  try { window.speechSynthesis.cancel(); } catch (_) {}
  const u = new SpeechSynthesisUtterance(text);
  u.rate = opts.rate != null ? opts.rate : state.settings.voice.rate;
  u.volume = state.settings.voice.volume;
  u.pitch = 0.92;
  const voice = preferredVoice();
  if (voice) u.voice = voice;
  u.onstart = () => {
    duckMusic();
    oracleViz.speaking = true;
    oracleViz.t0 = performance.now();
  };
  u.onend = done;
  u.onerror = done;
  duckMusic();
  oracleViz.speaking = true;
  const fallback = estimateSpeechMs(text, u.rate) + 800;
  clearTimeout(oracleViz.speechTimer);
  oracleViz.speechTimer = setTimeout(done, fallback);
  try {
    window.speechSynthesis.speak(u);
  } catch (_) {
    done();
  }
}

function stopSpeech() {
  cancelOracleSequence();
  if ("speechSynthesis" in window) {
    try { window.speechSynthesis.cancel(); } catch (_) {}
  }
  oracleViz.speaking = false;
  setOracleState(ORACLE_STATES.IDLE);
  unduckMusic();
}

function replayVoice() {
  if (!state.lastSpoken) return;
  speak(state.lastSpoken, { ignoreToken: true, visualState: ORACLE_STATES.SPEAKING, onEnd: () => {
    if (oracleViz.scenarioLocked) setOracleState(ORACLE_STATES.THINKING);
    else setOracleState(ORACLE_STATES.IDLE);
  }});
}

function speakScenario(text) {
  speak(text, {
    token: oracleViz.seqToken,
    keepDucked: true,
    visualState: ORACLE_STATES.SPEAKING,
    onEnd: () => startThinkingPause()
  });
}

function startThinkingPause() {
  const token = oracleViz.seqToken;
  setOracleState(ORACLE_STATES.THINKING);
  duckMusic();
  showReflect(true);
  showChooseLine(false);
  clearTimeout(oracleViz.thinkTimer);
  oracleViz.thinkTimer = setTimeout(() => {
    if (token !== oracleViz.seqToken) return;
    showReflect(false);
    speakChooseCarefully();
  }, 3000);
}

function speakChooseCarefully() {
  const token = oracleViz.seqToken;
  showChooseLine(true);
  speak("Choose carefully.", {
    token,
    rate: Math.min(0.84, state.settings.voice.rate),
    keepDucked: false,
    visualState: ORACLE_STATES.CHOOSE,
    silentHold: 900,
    onEnd: () => {
      if (token !== oracleViz.seqToken) return;
      showChoices();
    }
  });
}

function showChoices() {
  oracleViz.scenarioLocked = false;
  setOracleState(ORACLE_STATES.CHOOSING);
  const panel = document.getElementById("choice-panel");
  if (panel) {
    panel.hidden = false;
    panel.classList.remove("is-locked");
  }
  const a = document.getElementById("choice-a");
  const b = document.getElementById("choice-b");
  if (a) a.disabled = false;
  if (b) b.disabled = false;
  showChooseLine(true);
}

function beginScenarioSpeech(sc) {
  oracleViz.seqToken += 1;
  oracleViz.scenarioLocked = true;
  showReflect(false);
  showChooseLine(false);
  showOraclePresence(true);
  setOracleState(ORACLE_STATES.SPEAKING);
  const spoken = sc.situation;
  speakScenario(spoken);
}

/* ---------------------------------------------------------------------------
   SAVE / LOAD
   --------------------------------------------------------------------------- */
function serialize() {
  return {
    trialIndex: state.trialIndex,
    stats: { ...state.stats },
    flags: [...state.flags],
    journal: state.journal.map((j) => ({ ...j })),
    lastChoiceKey: state.lastChoiceKey,
    awaitingContinue: state.awaitingContinue,
    endingId: state.endingId,
    finalAnswer: state.finalAnswer,
    screen: state.screen,
    settings: {
      voice: { ...state.settings.voice },
      music: { ...state.settings.music }
    }
  };
}

function persist() {
  try {
    localStorage.setItem(GAME_SETTINGS.storageKey, JSON.stringify(serialize()));
    return true;
  } catch (_) {
    return false;
  }
}

function hasSave() {
  try {
    return !!localStorage.getItem(GAME_SETTINGS.storageKey);
  } catch (_) {
    return false;
  }
}

function loadSave() {
  try {
    const raw = localStorage.getItem(GAME_SETTINGS.storageKey);
    if (!raw) return false;
    const data = JSON.parse(raw);
    state.trialIndex = data.trialIndex || 0;
    state.stats = { ...STAT_DEFAULTS, ...(data.stats || {}) };
    state.flags = Array.isArray(data.flags) ? data.flags : [];
    state.journal = Array.isArray(data.journal) ? data.journal : [];
    state.lastChoiceKey = data.lastChoiceKey || null;
    state.awaitingContinue = !!data.awaitingContinue;
    state.endingId = data.endingId || null;
    state.finalAnswer = data.finalAnswer || null;
    state.screen = data.screen || "title";
    if (data.settings && data.settings.voice) {
      state.settings.voice = { ...VOICE_DEFAULTS, ...data.settings.voice };
    }
    if (data.settings && data.settings.music) {
      state.settings.music = { ...MUSIC_DEFAULTS, ...data.settings.music };
    }
    return true;
  } catch (_) {
    return false;
  }
}

function clearSave() {
  try { localStorage.removeItem(GAME_SETTINGS.storageKey); } catch (_) {}
}

function resetRun(keepSettings) {
  stopSpeech();
  showOraclePresence(false);
  showReflect(false);
  showChooseLine(false);
  const settings = keepSettings ? {
    voice: { ...state.settings.voice },
    music: { ...state.settings.music }
  } : {
    voice: { ...VOICE_DEFAULTS },
    music: { ...MUSIC_DEFAULTS }
  };
  state.screen = "title";
  state.trialIndex = 0;
  state.stats = { ...STAT_DEFAULTS };
  state.flags = [];
  state.journal = [];
  state.lastChoiceKey = null;
  state.awaitingContinue = false;
  state.endingId = null;
  state.finalAnswer = null;
  state.lastSpoken = "";
  state.settings = settings;
}

      ? `TRIAL ${String(n).padStart(2, "0")} / ${String(SCENARIOS.length).padStart(2, "0")}`
      : state.screen === "ending" || state.screen === "final" || state.screen === "complete"

        : "THE ARCHIVE";

  el.textContent = msg;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { el.hidden = true; }, 2200);
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function voiceDockHtml() {
  return `
    <div class="voice-dock" role="group" aria-label="Voice and music">
      <button type="button" class="icon-btn" id="dock-voice" aria-pressed="${state.settings.voice.enabled}">
        ${state.settings.voice.enabled ? "🔊 VOICE ON" : "🔇 VOICE OFF"}
      </button>
      <button type="button" class="icon-btn" id="dock-replay">▶ REPLAY VOICE</button>
      <button type="button" class="icon-btn" id="dock-music" aria-pressed="${state.settings.music.enabled}">
        ${state.settings.music.enabled ? "♪ MUSIC ON" : "♪ MUSIC OFF"}
      </button>
    </div>`;
}

function bindDock() {
  const v = document.getElementById("dock-voice");
  const r = document.getElementById("dock-replay");
  const m = document.getElementById("dock-music");
  if (v) v.addEventListener("click", () => {
    state.settings.voice.enabled = !state.settings.voice.enabled;
    if (!state.settings.voice.enabled) {
      try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (_) {}
      oracleViz.speaking = false;
      if (oracleViz.scenarioLocked && oracleViz.state === ORACLE_STATES.SPEAKING) {
        startThinkingPause();
      }
    }
    persist();
    if (v) {
      v.setAttribute("aria-pressed", String(state.settings.voice.enabled));
      v.textContent = state.settings.voice.enabled ? "🔊 VOICE ON" : "🔇 VOICE OFF";
    }
  });
  if (r) r.addEventListener("click", replayVoice);
  if (m) m.addEventListener("click", () => {
    state.settings.music.enabled = !state.settings.music.enabled;
    persist();
    if (state.settings.music.enabled) playMusic();
    else pauseMusic();
    if (m) {
      m.setAttribute("aria-pressed", String(state.settings.music.enabled));
      m.textContent = state.settings.music.enabled ? "♪ MUSIC ON" : "♪ MUSIC OFF";
    }
  });
}

function resolveOracle(choice) {
  if (choice.oracleMemory && choice.oracleMemory.length) {
    for (let i = 0; i < choice.oracleMemory.length; i++) {
      const m = choice.oracleMemory[i];
      if (state.flags.includes(m.flag)) return m.text;
    }
  }
  return choice.oracle;
}

/* ---------------------------------------------------------------------------
   SCREENS
   --------------------------------------------------------------------------- */
function renderTitle() {
  state.screen = "title";
  showTopbar(false);
  showOraclePresence(false);
  setOracleState(ORACLE_STATES.IDLE);
  stage().innerHTML = `
    <section class="screen title-screen" aria-labelledby="game-title">
      <div class="sigil" aria-hidden="true"><span>◇</span></div>
      <h1 class="game-title" id="game-title">THE PATH OF WISDOM</h1>
      <p class="subtitle">A JOURNEY THROUGH CHOICES</p>
      <p class="epigraph">Every path reveals something about the traveler.</p>
      <div class="btn-stack">
        <button type="button" class="primary-btn" id="btn-begin">BEGIN THE JOURNEY</button>
        ${hasSave() ? `<button type="button" class="ghost-btn" id="btn-continue-save">CONTINUE JOURNEY</button>` : ""}
        <button type="button" class="ghost-btn" id="btn-open-settings">SETTINGS</button>
        <button type="button" class="ghost-btn" id="btn-open-credits">CREDITS</button>
      </div>
      ${voiceDockHtml()}
    </section>`;
  document.getElementById("btn-begin").addEventListener("click", () => {
    playMusic();
    if (hasSave() && (state.journal.length || state.trialIndex > 0)) {
      openConfirm("Start a new journey? Your current path will be replaced.", () => {
        resetRun(true);
        persist();
        startIntro();
      });
    } else {
      startIntro();
    }
  });
  const cont = document.getElementById("btn-continue-save");
  if (cont) cont.addEventListener("click", () => {
    playMusic();
    if (loadSave()) resumeFromSave();
    else startIntro();
  });
  document.getElementById("btn-open-settings").addEventListener("click", openSettings);
  document.getElementById("btn-open-credits").addEventListener("click", openCredits);
  bindDock();
}

function startIntro() {
  state.screen = "intro";
  showTopbar(false);
  playMusic();
  runIntroSequence();
}

function runIntroSequence() {
  const beats = INTRO_BEATS.slice();
  let i = 0;
  function showBeat() {
    const beat = beats[i];
    stage().innerHTML = `
      <section class="screen intro-screen">
        <p class="intro-line show">${escapeHtml(beat.screen)}</p>
      </section>`;
    i += 1;
    if (i < beats.length) {
      setTimeout(showBeat, 900);
    } else {
      setTimeout(showOracleIntro, 800);
    }
  }
  showBeat();
}

function showOracleIntro() {
  showOraclePresence(true);
  setOracleState(ORACLE_STATES.SPEAKING);
  stage().innerHTML = `
    <section class="screen intro-screen">
      <p class="intro-line show">GUIDE IDENTIFIED</p>
      <h2 class="oracle-name">THE ORACLE</h2>
      <div id="intro-speeches"></div>
      <div class="continue-wrap" id="intro-continue" hidden>
        <button type="button" class="primary-btn" id="btn-intro-continue">CONTINUE</button>
      </div>
      ${voiceDockHtml()}
    </section>`;
  bindDock();
  const box = document.getElementById("intro-speeches");
  let n = 0;
  function nextLine() {
    if (n >= INTRO_LINES.length) {
      document.getElementById("intro-continue").hidden = false;
      document.getElementById("btn-intro-continue").addEventListener("click", () => {
        state.trialIndex = 0;
        state.awaitingContinue = false;
        persist();
        renderScenario();
      });
      document.getElementById("btn-intro-continue").focus();
      return;
    }
    const p = document.createElement("p");
    p.className = "oracle-speech";
    p.textContent = INTRO_LINES[n];
    box.appendChild(p);
    speak(INTRO_LINES[n]);
    n += 1;
    setTimeout(nextLine, 2600);
  }
  nextLine();
}

function renderScenario() {
  if (state.trialIndex >= SCENARIOS.length) {
    renderJudgment();
    return;
  }
  const sc = SCENARIOS[state.trialIndex];
  state.screen = "scenario";
  state.awaitingContinue = false;
  state.lastChoiceKey = null;
  showTopbar(true);
  showOraclePresence(true);
  showReflect(false);
  showChooseLine(false);
  stage().innerHTML = `
    <section class="screen" aria-labelledby="loc">
      <h2 class="location" id="loc">${escapeHtml(sc.location)}</h2>
      <article class="glass scene-card">
        <div class="scene-text">
          <p>${escapeHtml(sc.story)}</p>
          <p>${escapeHtml(sc.situation)}</p>
        </div>
      </article>
      <div id="choice-panel" class="choice-panel is-locked" hidden>
        <p class="choose-label">CHOOSE YOUR PATH</p>
        <div class="choices">
          <button type="button" class="path-btn" id="choice-a" data-choice="a" disabled>
            <span class="path-kicker">PATH A</span>
            <span class="path-label">${escapeHtml(sc.choices.a.label)}</span>
          </button>
          <button type="button" class="path-btn" id="choice-b" data-choice="b" disabled>
            <span class="path-kicker">PATH B</span>
            <span class="path-label">${escapeHtml(sc.choices.b.label)}</span>
          </button>
        </div>
      </div>
      ${voiceDockHtml()}
    </section>`;
  bindDock();
  const a = document.getElementById("choice-a");
  const b = document.getElementById("choice-b");
  a.addEventListener("click", () => selectChoice("a"));
  b.addEventListener("click", () => selectChoice("b"));
  persist();
  beginScenarioSpeech(sc);
}

function applyStats(delta) {
  STAT_KEYS.forEach((k) => {
    const d = delta[k] || 0;
    state.stats[k] = (state.stats[k] || 0) + d;
  });
}

function selectChoice(key) {
  if (state.screen !== "scenario") return;
  if (oracleViz.scenarioLocked) return;
  const sc = SCENARIOS[state.trialIndex];
  const choice = sc.choices[key];
  if (!choice) return;
  state.screen = "consequence";
  state.lastChoiceKey = key;
  state.awaitingContinue = true;
  document.getElementById("choice-a").disabled = true;
  document.getElementById("choice-b").disabled = true;
  applyStats(choice.stats || {});
  if (choice.memoryFlag && !state.flags.includes(choice.memoryFlag)) {
    state.flags.push(choice.memoryFlag);
  }
  const oracleText = resolveOracle(choice);
  state.journal.push({
    trial: state.trialIndex + 1,
    location: sc.location,
    choice: choice.journal,
    oracle: oracleText
  });
  persist();

  const card = document.querySelector(".scene-card");
  if (card) card.style.opacity = "0.72";

  setTimeout(() => {
    showReflect(false);
    showChooseLine(false);
    showOraclePresence(true);
    setOracleState(ORACLE_STATES.SPEAKING);
    stage().innerHTML = `
      <section class="screen" aria-labelledby="loc">
        <h2 class="location" id="loc">${escapeHtml(sc.location)}</h2>
        <article class="glass scene-card consequence-card">
          <p class="chosen">YOU CHOSE</p>
          <div class="scene-text">
            <p>${escapeHtml(choice.label)}</p>
            <p>${escapeHtml(choice.consequence)}</p>
          </div>
          <div class="oracle-box">
            <p class="oracle-kicker">THE ORACLE</p>
            <p class="oracle-line">${escapeHtml(oracleText)}</p>
          </div>
        </article>
        <div class="continue-wrap">
          <button type="button" class="primary-btn" id="btn-next">CONTINUE</button>
        </div>
        ${voiceDockHtml()}
      </section>`;
    bindDock();
    speak(oracleText, {
      ignoreToken: true,
      visualState: ORACLE_STATES.SPEAKING,
      onEnd: () => setOracleState(ORACLE_STATES.IDLE)
    });
    document.getElementById("btn-next").addEventListener("click", advanceAfterChoice);
    document.getElementById("btn-next").focus();
  }, 280);
}

function advanceAfterChoice() {
  stopSpeech();
  showReflect(false);
  showChooseLine(false);
  state.trialIndex += 1;
  state.awaitingContinue = false;
  state.lastChoiceKey = null;
  persist();
  if (state.trialIndex >= SCENARIOS.length) renderJudgment();
  else renderScenario();
}

function renderJudgment() {
  state.screen = "ending";
  showTopbar(true);
  showOraclePresence(true);
  showReflect(false);
  showChooseLine(false);
  setOracleState(ORACLE_STATES.SPEAKING);
  const ending = chooseEnding(state.stats);
  state.endingId = ending.id;
  persist();
  stopMusicFade();
  setTimeout(() => {
    if (state.settings.music.enabled) {
      // keep a whisper of music if possible
      if (music.el && !music.missing) {
        music.el.volume = Math.min(0.12, state.settings.music.volume * 0.3);
        playMusic();
      }
    }
  }, 800);

  stage().innerHTML = `
    <section class="screen ending-screen">
      <div class="ending-sigil" aria-hidden="true">◇</div>
      <p class="final-q">FINAL JUDGMENT</p>
      <h2 class="ending-name">${escapeHtml(ending.name)}</h2>
      <p class="oracle-speech">${escapeHtml(ending.text)}</p>
      <p class="oracle-speech">${escapeHtml(ending.oracle)}</p>
      <div class="continue-wrap">
        <button type="button" class="primary-btn" id="btn-final-q">THE FINAL QUESTION</button>
      </div>
      ${voiceDockHtml()}
    </section>`;
  bindDock();
  speak(ending.text + " " + ending.oracle);
  document.getElementById("btn-final-q").addEventListener("click", renderFinalQuestion);
}

function renderFinalQuestion() {
  state.screen = "final";
  showTopbar(true);
  persist();
  stage().innerHTML = `
    <section class="screen ending-screen">
      <div class="ending-sigil" aria-hidden="true">◇</div>
      <p class="final-q">THE FINAL QUESTION</p>
      <p class="oracle-speech">What did you discover?</p>
      <div class="btn-stack">
        <button type="button" class="primary-btn" data-ans="values">${FINAL_ANSWERS.values.label}</button>
        <button type="button" class="ghost-btn" data-ans="mistakes">${FINAL_ANSWERS.mistakes.label}</button>
        <button type="button" class="ghost-btn" data-ans="searching">${FINAL_ANSWERS.searching.label}</button>
      </div>
      ${voiceDockHtml()}
    </section>`;
  bindDock();
  speak("What did you discover?");
  stage().querySelectorAll("[data-ans]").forEach((btn) => {
    btn.addEventListener("click", () => renderComplete(btn.getAttribute("data-ans")));
  });
}

function renderComplete(ans) {
  const reply = FINAL_ANSWERS[ans] || FINAL_ANSWERS.searching;
  state.finalAnswer = ans;
  state.screen = "complete";
  persist();
  stage().innerHTML = `
    <section class="screen ending-screen">
      <div class="ending-sigil" aria-hidden="true">◇</div>
      <p class="oracle-speech">${escapeHtml(reply.oracle)}</p>
      <p class="subtitle" style="margin-top:28px">JOURNEY COMPLETE</p>
      <div class="btn-stack">
        <button type="button" class="primary-btn" id="btn-again">PLAY AGAIN</button>
        <button type="button" class="ghost-btn" id="btn-end-journal">JOURNAL</button>
        <button type="button" class="ghost-btn" id="btn-end-title">RETURN TO TITLE</button>
      </div>
      ${voiceDockHtml()}
    </section>`;
  bindDock();
  speak(reply.oracle);
  document.getElementById("btn-again").addEventListener("click", () => {
    openConfirm("Begin the journey again? Your current ending will remain in the journal until you start.", () => {
      resetRun(true);
      persist();
      if (state.settings.music.enabled) {
        if (music.el) music.el.volume = state.settings.music.volume;
        playMusic();
      }
      startIntro();
    });
  });
  document.getElementById("btn-end-journal").addEventListener("click", openJournal);
  document.getElementById("btn-end-title").addEventListener("click", () => {
    persist();
    if (state.settings.music.enabled) {
      if (music.el) music.el.volume = state.settings.music.volume;
      playMusic();
    }
    renderTitle();
  });
}

function resumeFromSave() {
  playMusic();
  if (state.screen === "complete") renderComplete(state.finalAnswer || "searching");
  else if (state.screen === "final") renderFinalQuestion();
  else if (state.screen === "ending") renderJudgment();
  else if (state.screen === "consequence" && state.awaitingContinue) {
    // re-show last consequence
    const idx = state.trialIndex;
    if (idx < SCENARIOS.length && state.lastChoiceKey && state.journal.length) {
      const sc = SCENARIOS[idx];
      const last = state.journal[state.journal.length - 1];
      state.screen = "consequence";
      showTopbar(true);
      stage().innerHTML = `
        <section class="screen">
          <h2 class="location">${escapeHtml(sc.location)}</h2>
          <article class="glass scene-card consequence-card">
            <p class="chosen">YOU CHOSE</p>
            <div class="scene-text">
              <p>${escapeHtml(last.choice)}</p>
            </div>
            <div class="oracle-box">
              <p class="oracle-kicker">THE ORACLE</p>
              <p class="oracle-line">${escapeHtml(last.oracle)}</p>
            </div>
          </article>
          <div class="continue-wrap">
            <button type="button" class="primary-btn" id="btn-next">CONTINUE</button>
          </div>
          ${voiceDockHtml()}
        </section>`;
      bindDock();
      document.getElementById("btn-next").addEventListener("click", advanceAfterChoice);
    } else renderScenario();
  } else if (state.screen === "intro") startIntro();
  else if (state.trialIndex >= SCENARIOS.length) renderJudgment();
  else renderScenario();
}

  const root = document.getElementById("modal-root");
  document.getElementById("modal-title").textContent = title;
  document.getElementById("modal-body").innerHTML = html;
  root.hidden = false;
  const close = () => { root.hidden = true; };
  document.getElementById("modal-close").onclick = close;
  root.querySelector("[data-close-modal]").onclick = close;
  if (after) after();
  document.getElementById("modal-close").focus();
}

    <div class="settings-grid">

        </div>
      </div>
      <div class="setting">
        <label for="set-vvol">VOICE VOLUME — ${Math.round(state.settings.voice.volume * 100)}%</label>

      </div>
      <div class="setting">
        <label>BACKGROUND MUSIC</label>
        <div class="toggle-row">
          <button type="button" class="icon-btn" id="set-music-on" aria-pressed="${state.settings.music.enabled}">ON</button>
          <button type="button" class="icon-btn" id="set-music-off" aria-pressed="${!state.settings.music.enabled}">OFF</button>
        </div>
      </div>
      <div class="setting">
        <label for="set-mvol">MUSIC VOLUME — ${Math.round(state.settings.music.volume * 100)}%</label>
        <input id="set-mvol" type="range" min="0" max="100" value="${Math.round(state.settings.music.volume * 100)}" />

        <label>JOURNEY</label>

      on.setAttribute("aria-pressed", String(state.settings.voice.enabled));

    };
    on.onclick = () => { state.settings.voice.enabled = true; persist(); syncVoiceBtns(); };
    off.onclick = () => { state.settings.voice.enabled = false; stopSpeech(); persist(); syncVoiceBtns(); };
    document.getElementById("set-voice").onchange = (e) => {
      state.settings.voice.voiceURI = e.target.value;
      persist();
    };
    document.querySelectorAll(".set-speed").forEach((btn) => {
      btn.onclick = () => {
        state.settings.voice.rate = parseFloat(btn.dataset.rate);
        persist();
        document.querySelectorAll(".set-speed").forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
      };
    });
    document.getElementById("set-vvol").oninput = (e) => {
      state.settings.voice.volume = Number(e.target.value) / 100;
      e.target.previousElementSibling
        ? null
        : null;

      if (lab) lab.textContent = `VOICE VOLUME — ${e.target.value}%`;
      persist();
    };
    const mon = document.getElementById("set-music-on");
    const moff = document.getElementById("set-music-off");
    const syncMusic = () => {
      mon.setAttribute("aria-pressed", String(state.settings.music.enabled));
      moff.setAttribute("aria-pressed", String(!state.settings.music.enabled));
    };
    mon.onclick = () => { state.settings.music.enabled = true; playMusic(); persist(); syncMusic(); };

        document.getElementById("modal-root").hidden = true;
        if (state.settings.music.enabled) {
          if (music.el) music.el.volume = state.settings.music.volume;
          playMusic();
        }
        renderTitle();
      });
    };
  });

/* ---------------------------------------------------------------------------
   PARTICLES
   --------------------------------------------------------------------------- */
function initParticles() {
  const canvas = document.getElementById("particle-canvas");
  if (!canvas) return;
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const ctx = canvas.getContext("2d");
  let w = 0, h = 0, pts = [];
  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  function spawn() {
    const n = reduce ? 18 : 56;
    pts = Array.from({ length: n }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      r: Math.random() * 1.6 + 0.4,
      s: Math.random() * 0.25 + 0.05,
      a: Math.random() * 0.35 + 0.08
    }));
  }
  resize();
  spawn();
  window.addEventListener("resize", () => { resize(); spawn(); });
  if (reduce) {
    function still() {
      ctx.clearRect(0, 0, w, h);
      pts.forEach((p) => {
        ctx.beginPath();
        ctx.fillStyle = `rgba(126,200,212,${p.a})`;
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      });
    }
    still();
    return;
  }
  function tick() {
    ctx.clearRect(0, 0, w, h);
    pts.forEach((p) => {
      p.y -= p.s;
      if (p.y < -4) { p.y = h + 4; p.x = Math.random() * w; }
      ctx.beginPath();
      ctx.fillStyle = `rgba(126,200,212,${p.a})`;
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    });
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

/* ---------------------------------------------------------------------------
   KEYBOARD
   --------------------------------------------------------------------------- */
function initKeys() {
  document.addEventListener("keydown", (e) => {
    const root = document.getElementById("modal-root");
    if (e.key === "Escape" && root && !root.hidden) {
      root.hidden = true;
      return;
    }
    if (root && !root.hidden) return;
    if (state.screen === "scenario" && !oracleViz.scenarioLocked) {
      if (e.key === "1" || e.key === "a" || e.key === "A") {
        e.preventDefault();
        selectChoice("a");
      } else if (e.key === "2" || e.key === "b" || e.key === "B") {
        e.preventDefault();
        selectChoice("b");
      }
    }
    if ((e.key === "Enter") && state.screen === "consequence") {
      const n = document.getElementById("btn-next");
      if (n) n.click();
    }
  });
}

/* ---------------------------------------------------------------------------
   BOOT
   --------------------------------------------------------------------------- */
function boot() {
  initMusic();
  initParticles();
  startOracleVisualizer();
  initKeys();
  if ("speechSynthesis" in window) {
    loadVoices();
    window.speechSynthesis.addEventListener("voiceschanged", loadVoices);
  }
  document.getElementById("btn-journal").addEventListener("click", openJournal);
  document.getElementById("btn-save").addEventListener("click", () => {
    persist();
    toast("JOURNEY SAVED");
  });
  document.getElementById("btn-settings").addEventListener("click", openSettings);

  // Load settings from any existing save without jumping into mid-game.
  try {
    const raw = localStorage.getItem(GAME_SETTINGS.storageKey);
    if (raw) {
      const data = JSON.parse(raw);
      if (data.settings && data.settings.voice) {
        state.settings.voice = { ...VOICE_DEFAULTS, ...data.settings.voice };
      }
      if (data.settings && data.settings.music) {
        state.settings.music = { ...MUSIC_DEFAULTS, ...data.settings.music };
      }
    }
  } catch (_) {}

  renderTitle();

  // Unlock audio on first gesture.
  const unlock = () => {
    if (state.settings.music.enabled) playMusic();
    document.removeEventListener("pointerdown", unlock);
    document.removeEventListener("keydown", unlock);
  };
  document.addEventListener("pointerdown", unlock);
  document.addEventListener("keydown", unlock);
}

document.addEventListener("DOMContentLoaded", boot);

  </script>
</body>
</html>
